<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image resize, crop, and quality comparison</title>
  <style>
    :root { --bar-thickness: 16px; --accent: #00aaff; }
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Drop zone is a <label> so clicks natively open the file input */
    #drop-zone {
      border: 2px dashed #ccc;
      border-radius: 20px;
      width: 100%;
      min-height: 200px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden; /* no scrollbars here either */
    }
    #drop-zone.dragover { background-color: #e0e0e0; }

    /* Hide file input in an accessible way (not display:none) */
    .visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .format-tabs {
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: repeat(var(--format-count, 3), minmax(58px, 1fr));
      width: min(100%, 360px);
      border: 1px solid #bbb;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .format-tabs:empty { display: none; }
    .format-tab {
      appearance: none;
      border: 0;
      border-right: 1px solid #bbb;
      background: #fff;
      color: #222;
      cursor: pointer;
      font: inherit;
      padding: 10px 14px;
    }
    .format-tab:last-child { border-right: 0; }
    .format-tab[aria-selected="true"] {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .format-tab:focus-visible {
      outline: 2px solid #005f99;
      outline-offset: -2px;
    }

    #output {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 20px;
    }
    .image-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .image-container img {
      max-width: 80%;
      height: auto;
      cursor: pointer;
      transition: max-width 0.3s ease;
    }
    .image-container img.full-width { max-width: unset; }
    .image-info { margin-top: 10px; }
    /* ---------- Crop editor ---------- */
    #editor { margin-top: 16px; }
    #editor[hidden] { display: none; }
    .crop-hint { margin: 0 0 10px; color: #555; font-size: 14px; line-height: 1.4; }

    /* The stage shows the image plus spare room on every side, so that the
       crop box can be dragged out past the edges of the image. */
    #stage-wrap {
      display: flex;
      justify-content: center;
      background: #e4e6ea;
      border-radius: 10px;
      overflow: hidden;
    }
    #cropper {
      position: relative;
      flex: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #crop-fill, #image-backdrop, #source-image, .crop-box { position: absolute; }
    #crop-fill, #image-backdrop { pointer-events: none; }
    .checker {
      background: repeating-conic-gradient(#cfd3d8 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
    }
    #source-image {
      display: block;
      max-width: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .crop-box {
      box-sizing: border-box;
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      /* Dims everything outside the crop */
      box-shadow: 0 0 0 9999px rgba(20, 24, 31, 0.5);
      cursor: move;
      touch-action: none;
    }

    /* Edge and corner handles: a large invisible hit area around a small grip */
    .crop-bar, .crop-handle {
      position: absolute;
      touch-action: none;
    }
    .crop-bar::after, .crop-handle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid var(--accent);
      box-sizing: border-box;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }
    .crop-bar.top, .crop-bar.bottom { left: 0; right: 0; height: 28px; cursor: ns-resize; }
    .crop-bar.left, .crop-bar.right { top: 0; bottom: 0; width: 28px; cursor: ew-resize; }
    .crop-bar.top    { top: -14px; }
    .crop-bar.bottom { bottom: -14px; }
    .crop-bar.left   { left: -14px; }
    .crop-bar.right  { right: -14px; }
    .crop-bar.top::after, .crop-bar.bottom::after { width: 32px; height: 10px; border-radius: 5px; }
    .crop-bar.left::after, .crop-bar.right::after { width: 10px; height: 32px; border-radius: 5px; }
    .crop-box.narrow .crop-bar.top::after, .crop-box.narrow .crop-bar.bottom::after,
    .crop-box.short .crop-bar.left::after, .crop-box.short .crop-bar.right::after { display: none; }

    .crop-handle { width: 40px; height: 40px; }
    .crop-handle::after { width: 18px; height: 18px; border-radius: 50%; }
    .crop-handle.tl { left: -20px; top: -20px; cursor: nwse-resize; }
    .crop-handle.tr { right: -20px; top: -20px; cursor: nesw-resize; }
    .crop-handle.bl { left: -20px; bottom: -20px; cursor: nesw-resize; }
    .crop-handle.br { right: -20px; bottom: -20px; cursor: nwse-resize; }

    /* ---------- Controls under the stage ---------- */
    .crop-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px 40px;
      margin-top: 16px;
    }
    .nudge {
      display: grid;
      grid-template-columns: auto auto auto;
      grid-template-areas: ". top ." "left size right" ". bottom .";
      gap: 10px 14px;
      align-items: center;
      justify-items: center;
    }
    .nudge-pad { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nudge-label { font-size: 12px; color: #555; white-space: nowrap; }
    .nudge-label b { color: #222; font-variant-numeric: tabular-nums; }
    .nudge-buttons {
      display: inline-flex;
      border: 1px solid #bbb;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .nudge-buttons button {
      appearance: none;
      border: 0;
      background: #fff;
      color: #222;
      width: 42px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .nudge-buttons button + button { border-left: 1px solid #bbb; }
    .nudge-buttons button:hover { background: #f0f7fc; }
    .nudge-buttons button:active { background: var(--accent); color: #fff; }
    .nudge-buttons button:focus-visible { outline: 2px solid #005f99; outline-offset: -2px; }
    .nudge-buttons svg { width: 16px; height: 16px; display: block; }
    .crop-size { grid-area: size; text-align: center; min-width: 96px; }
    .crop-size strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .crop-size span { font-size: 12px; color: #555; }

    .crop-options { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    .bg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .bg-row label { display: inline-flex; align-items: center; gap: 6px; }
    #background-color { width: 44px; height: 32px; padding: 0; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
    .bg-status { font-size: 12px; color: #555; margin: -6px 0 0; }
    .plain-button {
      appearance: none;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font: inherit;
      font-size: 14px;
      padding: 7px 12px;
      cursor: pointer;
    }
    .plain-button:hover:not(:disabled) { background: #f0f7fc; }
    .plain-button:disabled { color: #999; cursor: default; }
    .plain-button:focus-visible { outline: 2px solid #005f99; outline-offset: 1px; }
  </style>
</head>
<body>
  <h1>Image resize, crop, and quality comparison</h1>

  <!-- Upload area is a label linked to the hidden file input -->
  <label id="drop-zone" for="file-input">
    <p id="dz-instruction">Drop an image here, click to select, or paste an image</p>
  </label>
  <input type="file" id="file-input" accept="image/*" class="visually-hidden-file">

  <!-- Crop editor appears BELOW the upload area once an image is loaded -->
  <section id="editor" hidden>
    <p class="crop-hint">Drag the handles to crop, or drag inside the box to move it. Pull a handle past the edge of the image to add space around it.</p>
    <div id="stage-wrap">
      <div id="cropper">
        <div id="crop-fill"></div>
        <div id="image-backdrop" class="checker"></div>
        <img id="source-image" alt="Source image for cropping">
        <div class="crop-box" data-handle="move" aria-label="Crop region">
          <div class="crop-bar top" data-handle="t"></div>
          <div class="crop-bar bottom" data-handle="b"></div>
          <div class="crop-bar left" data-handle="l"></div>
          <div class="crop-bar right" data-handle="r"></div>
          <div class="crop-handle tl" data-handle="tl"></div>
          <div class="crop-handle tr" data-handle="tr"></div>
          <div class="crop-handle bl" data-handle="bl"></div>
          <div class="crop-handle br" data-handle="br"></div>
        </div>
      </div>
    </div>

    <div class="crop-controls">
      <div class="nudge" id="nudge" role="group" aria-label="Move each edge one pixel at a time">
        <div class="crop-size" aria-live="polite">
          <strong id="crop-size"></strong>
          <span id="crop-size-note"></span>
        </div>
      </div>

      <div class="crop-options">
        <div class="bg-row">
          <label for="background-color">Background <input type="color" id="background-color" value="#ffffff"></label>
          <label><input type="checkbox" id="background-transparent"> Transparent</label>
          <button type="button" class="plain-button" id="background-auto">Auto-detect</button>
        </div>
        <p class="bg-status" id="background-status"></p>
        <button type="button" class="plain-button" id="crop-reset">Reset crop</button>
      </div>
    </div>
  </section>

  <div id="format-tabs" class="format-tabs" role="tablist" aria-label="Output format"></div>
  <div id="output"></div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const output = document.getElementById('output');
    const formatTabs = document.getElementById('format-tabs');
    const colorPicker = document.getElementById('background-color');
    const editor = document.getElementById('editor');
    const stageWrap = document.getElementById('stage-wrap');
    const stage = document.getElementById('cropper');
    const cropFill = document.getElementById('crop-fill');
    const imageBackdrop = document.getElementById('image-backdrop');
    const sourceImage = document.getElementById('source-image');
    const cropBox = stage.querySelector('.crop-box');
    const nudgePanel = document.getElementById('nudge');
    const cropSizeLabel = document.getElementById('crop-size');
    const cropSizeNote = document.getElementById('crop-size-note');
    const transparentCheckbox = document.getElementById('background-transparent');
    const autoBackgroundButton = document.getElementById('background-auto');
    const backgroundStatus = document.getElementById('background-status');
    const resetCropButton = document.getElementById('crop-reset');

    const QUALITY_VALUES = [1, 0.9, 0.7, 0.5, 0.3];
    const OUTPUT_FORMATS = {
      jpeg: { label: 'JPEG', mime: 'image/jpeg', extension: 'jpg', supportsAlpha: false, qualityValues: QUALITY_VALUES },
      webp: { label: 'WebP', mime: 'image/webp', extension: 'webp', supportsAlpha: true, qualityValues: QUALITY_VALUES, wasmPackage: '@jsquash/webp' },
      avif: { label: 'AVIF', mime: 'image/avif', extension: 'avif', supportsAlpha: true, qualityValues: QUALITY_VALUES, wasmPackage: '@jsquash/avif' },
      png: { label: 'PNG', mime: 'image/png', extension: 'png', supportsAlpha: true, qualityValues: [null] }
    };

    let currentImage = null;       // HTMLImageElement created from file
    // { x, y, width, height } in whole IMAGE (natural) pixels. It may extend
    // past the image on any side: those areas are filled with the background.
    let cropRect = null;
    let activeFormat = null;
    let supportedFormatKeys = [];
    let imageHasAlpha = false;
    // Fill for areas outside the image (and under transparent pixels for
    // formats without alpha). `auto` is what was detected from the edges.
    let background = { color: '#ffffff', transparent: false, manual: false, auto: { color: '#ffffff', transparent: false } };
    let renderGeneration = 0;
    let renderAbortController = null;
    let outputUrls = [];
    const MAX_EXPAND = 4096;       // how far each edge may move outside the image, in image pixels

    detectSupportedOutputFormats().then(keys => {
      supportedFormatKeys = keys.length ? keys : ['png'];
      activeFormat = supportedFormatKeys[0];
      renderFormatTabs();
      updateBackgroundControls();
      if (currentImage) processImage(currentImage);
    });

    // Drag & drop + paste still supported
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', handleDrop);
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    document.addEventListener('paste', handlePaste);
    window.addEventListener('resize', () => { if (currentImage && !dragState) layoutCropper(); });
    window.addEventListener('beforeunload', revokeOutputUrls);

    function renderFormatTabs() {
      formatTabs.innerHTML = '';
      formatTabs.style.setProperty('--format-count', String(Math.max(1, supportedFormatKeys.length)));
      formatTabs.style.width = `min(100%, ${Math.max(1, supportedFormatKeys.length) * 120}px)`;

      supportedFormatKeys.forEach(key => {
        const format = OUTPUT_FORMATS[key];
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'format-tab';
        tab.id = `format-tab-${key}`;
        tab.dataset.format = key;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', String(key === activeFormat));
        tab.textContent = format.label;
        if (format.wasmPackage && !nativeEncodeSupported[key]) {
          tab.title = `This browser has no ${format.label} encoder that respects quality settings, so the ${format.wasmPackage} encoder is loaded from jsdelivr on first use.`;
        }
        tab.addEventListener('click', () => {
          if (activeFormat === key) return;
          const scrollState = captureScrollState();
          activeFormat = key;
          updateFormatTabsSelectedState();
          updateBackgroundControls();
          if (currentImage) {
            processImage(currentImage, { preserveScroll: true, scrollState });
          } else {
            maintainScrollPosition(scrollState);
          }
        });

        formatTabs.appendChild(tab);
      });
    }

    /* ---------- WebP and AVIF encoding ----------
       Browsers that cannot encode a format from a canvas silently return a
       PNG instead: Safari (desktop and iOS) cannot do WebP, and most browsers
       cannot do AVIF. Feature-detect each format once, and only when native
       encoding is missing (or ignores quality) load a jSquash wasm encoder
       (Squoosh's libwebp or libavif) from jsdelivr the first time that format
       is actually requested. */
    const JSQUASH_WEBP_ENCODE_URL = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/encode.js/+esm';
    const JSQUASH_AVIF_ENCODE_URL = 'https://cdn.jsdelivr.net/npm/@jsquash/avif@2.1.1/encode.js/+esm';
    const nativeEncodeSupported = {};
    let jsquashWebpPromise = null;

    function loadJsquashWebpEncoder() {
      if (!jsquashWebpPromise) {
        // Call init() explicitly: encode() would otherwise cache a failed wasm
        // load for the lifetime of the page, so a flaky connection could never
        // be retried.
        jsquashWebpPromise = import(JSQUASH_WEBP_ENCODE_URL).then(async mod => {
          await mod.init();
          return mod.default;
        });
        jsquashWebpPromise.catch(() => { jsquashWebpPromise = null; });
      }
      return jsquashWebpPromise;
    }

    // The AVIF encoder takes seconds per image, so unlike WebP it runs in a
    // module worker to keep the page responsive.
    const AVIF_WORKER_SOURCE = `
      let encoderPromise = null;
      self.onmessage = async (e) => {
        const { data, width, height, quality } = e.data;
        try {
          if (!encoderPromise) {
            encoderPromise = import(${JSON.stringify(JSQUASH_AVIF_ENCODE_URL)}).then(async (mod) => {
              await mod.init();
              return mod.default;
            });
          }
          const encode = await encoderPromise;
          const buffer = await encode({ data, width, height }, { quality });
          self.postMessage({ buffer }, [buffer]);
        } catch (err) {
          self.postMessage({ error: String((err && err.message) || err) });
        }
      };
    `;
    let avifWorkerUrl = null;
    let avifWorker = null;
    // Encodes run one at a time, in the order they were requested.
    let avifQueue = Promise.resolve();

    function runAvifWorkerJob(imageData, quality) {
      if (!avifWorker) {
        avifWorkerUrl = avifWorkerUrl || URL.createObjectURL(new Blob([AVIF_WORKER_SOURCE], { type: 'text/javascript' }));
        avifWorker = new Worker(avifWorkerUrl, { type: 'module' });
      }
      const worker = avifWorker;
      return new Promise((resolve, reject) => {
        const fail = message => {
          // Start from a fresh worker next time, so a failed encoder download
          // can be retried instead of being cached for the life of the page.
          worker.terminate();
          if (avifWorker === worker) avifWorker = null;
          reject(new Error(message));
        };
        worker.onmessage = e => {
          if (e.data.error !== undefined) fail(e.data.error);
          else resolve(new Blob([e.data.buffer], { type: 'image/avif' }));
        };
        worker.onerror = e => {
          e.preventDefault();
          fail(e.message || 'AVIF encoder worker failed');
        };
        const { data, width, height } = imageData;
        worker.postMessage({ data, width, height, quality }, [data.buffer]);
      });
    }

    // The pixels are read when the job starts, so the canvas must not be
    // drawn on again until the returned promise settles. A job whose `signal`
    // has been aborted by then (the crop or format changed) is skipped.
    function encodeAvifWithWasm(canvas, quality, signal) {
      const job = avifQueue.then(() => {
        if (signal && signal.aborted) throw new DOMException('AVIF encode cancelled', 'AbortError');
        const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        return runAvifWorkerJob(imageData, Math.round(clamp(0, quality, 1) * 100));
      });
      avifQueue = job.catch(() => {});
      return job;
    }

    function wasmFallbackAvailable(format) {
      const hasWasm = typeof WebAssembly !== 'undefined' && typeof WebAssembly.instantiate === 'function';
      return hasWasm && (format.mime !== 'image/avif' || typeof Worker !== 'undefined');
    }

    function detectSupportedOutputFormats() {
      return Promise.all(
        Object.entries(OUTPUT_FORMATS).map(([key, format]) => {
          const detect = format.wasmPackage ? nativeEncoderHonoursQuality : canExportMime;
          return detect(format.mime).then(isSupported => {
            if (format.wasmPackage) {
              nativeEncodeSupported[key] = isSupported;
              return isSupported || wasmFallbackAvailable(format) ? key : null;
            }
            return isSupported ? key : null;
          });
        })
      ).then(keys => keys.filter(Boolean));
    }

    function canExportMime(mime) {
      if (mime === 'image/png') return Promise.resolve(true);

      const canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = 1;
      if (!canvas.toBlob) return Promise.resolve(false);

      return new Promise(resolve => {
        canvas.toBlob(blob => {
          resolve(Boolean(blob && blob.type === mime));
        }, mime);
      });
    }

    // A native encoder with a wasm alternative is only used if it also
    // honours the quality setting. Mobile Safari encodes AVIF but ignores
    // quality, which made every quality level the same (huge) file.
    async function nativeEncoderHonoursQuality(mime) {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      if (!canvas.toBlob) return false;
      // Noise, so that a lower quality has detail to throw away.
      const ctx = canvas.getContext('2d');
      const noise = ctx.createImageData(64, 64);
      for (let i = 0; i < noise.data.length; i++) {
        noise.data[i] = i % 4 === 3 ? 255 : Math.random() * 256;
      }
      ctx.putImageData(noise, 0, 0);
      const encodeAt = quality => new Promise(resolve => {
        try {
          canvas.toBlob(resolve, mime, quality);
        } catch (err) {
          resolve(null);
        }
      });
      const [low, high] = await Promise.all([encodeAt(0.2), encodeAt(0.9)]);
      return Boolean(low && high && low.type === mime && high.type === mime && low.size !== high.size);
    }

    function updateFormatTabsSelectedState() {
      formatTabs.querySelectorAll('.format-tab').forEach(tab => {
        tab.setAttribute('aria-selected', String(tab.dataset.format === activeFormat));
      });
    }

    function captureScrollState() {
      return { x: window.scrollX, y: window.scrollY };
    }

    function maintainScrollPosition(scrollState) {
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      const requiredDocumentHeight = scrollState.y + viewportHeight;
      const currentDocumentHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);

      if (currentDocumentHeight < requiredDocumentHeight) {
        const currentMinHeight = Number.parseFloat(output.style.minHeight) || output.offsetHeight;
        output.style.minHeight = `${currentMinHeight + requiredDocumentHeight - currentDocumentHeight}px`;
      }

      window.scrollTo(scrollState.x, scrollState.y);
    }

    function handleDrop(e) {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFile(file);
    }

    function handlePaste(e) {
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          handleFile(blob);
          break;
        }
      }
    }

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          cropRect = { x: 0, y: 0, width: img.width, height: img.height };
          imageHasAlpha = detectImageAlpha(img);
          const detected = detectEdgeBackground(img);
          background = { ...detected, manual: false, auto: detected };
          sourceImage.src = img.src;
          editor.hidden = false;       // shown BELOW the drop zone
          updateBackgroundControls();
          layoutCropper();
          processImage(img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ---------- Background colour ---------- */
    // The most common colour around the outside edge of the image. Colours
    // are grouped into buckets of similar shades (so JPEG noise still counts
    // as one colour) and the winning bucket is averaged.
    function detectEdgeBackground(img) {
      const fallback = { color: '#ffffff', transparent: false };
      const w = img.width, h = img.height;
      if (!w || !h) return fallback;
      const strips = [[0, 0, w, 1], [0, h - 1, w, 1], [0, 0, 1, h], [w - 1, 0, 1, h]];
      const buckets = new Map();
      let transparentCount = 0;
      try {
        for (const [sx, sy, sw, sh] of strips) {
          const canvas = document.createElement('canvas');
          canvas.width = sw;
          canvas.height = sh;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
          const data = ctx.getImageData(0, 0, sw, sh).data;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 16) { transparentCount++; continue; }
            const key = (data[i] >> 3) << 10 | (data[i + 1] >> 3) << 5 | (data[i + 2] >> 3);
            let bucket = buckets.get(key);
            if (!bucket) buckets.set(key, bucket = [0, 0, 0, 0]);
            bucket[0]++; bucket[1] += data[i]; bucket[2] += data[i + 1]; bucket[3] += data[i + 2];
          }
        }
      } catch (_) {
        return fallback;
      }
      let best = null;
      for (const bucket of buckets.values()) if (!best || bucket[0] > best[0]) best = bucket;
      if (!best || transparentCount > best[0]) return { color: '#ffffff', transparent: true };
      const hex = n => Math.round(n / best[0]).toString(16).padStart(2, '0');
      return { color: `#${hex(best[1])}${hex(best[2])}${hex(best[3])}`, transparent: false };
    }

    // Checked once per image, on a scaled-down copy.
    function detectImageAlpha(img) {
      const ratio = Math.min(1, 1024 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * ratio));
      canvas.height = Math.max(1, Math.round(img.height * ratio));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      try {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 3; i < data.length; i += 4) if (data[i] < 255) return true;
        return false;
      } catch (_) {
        return true;
      }
    }

    function backgroundIsTransparent(format) {
      return Boolean(format && format.supportsAlpha && background.transparent);
    }

    function updateBackgroundControls() {
      const format = OUTPUT_FORMATS[activeFormat];
      const alpha = Boolean(format && format.supportsAlpha);
      colorPicker.value = background.color;
      transparentCheckbox.checked = alpha && background.transparent;
      transparentCheckbox.disabled = !alpha;
      transparentCheckbox.parentElement.title = alpha ? '' : `${format ? format.label : 'This format'} has no transparency`;
      autoBackgroundButton.disabled = !background.manual;
      backgroundStatus.textContent = background.manual
        ? 'Custom background.'
        : 'Detected from the most common colour on the edges of the image.';
      const transparent = backgroundIsTransparent(format);
      cropFill.classList.toggle('checker', transparent);
      cropFill.style.backgroundColor = transparent ? '' : background.color;
      imageBackdrop.hidden = !(alpha && imageHasAlpha);
    }

    function backgroundChanged() {
      updateBackgroundControls();
      scheduleProcess();
    }

    colorPicker.addEventListener('input', () => {
      background.color = colorPicker.value;
      background.transparent = false;
      background.manual = true;
      backgroundChanged();
    });
    transparentCheckbox.addEventListener('change', () => {
      background.transparent = transparentCheckbox.checked;
      background.manual = true;
      backgroundChanged();
    });
    autoBackgroundButton.addEventListener('click', () => {
      background = { ...background.auto, manual: false, auto: background.auto };
      backgroundChanged();
    });

    /* ---------- Cropper layout ---------- */
    // The stage shows `view`, a rectangle in image pixels that covers the
    // image and the crop plus a margin to drag into, at `scale` screen pixels
    // per image pixel. It is re-fitted whenever a drag or nudge finishes.
    let view = null;
    let scale = 1;

    function cropEdges() {
      return { l: cropRect.x, t: cropRect.y, r: cropRect.x + cropRect.width, b: cropRect.y + cropRect.height };
    }

    function setCropEdges(e) {
      cropRect = { x: e.l, y: e.t, width: e.r - e.l, height: e.b - e.t };
    }

    function layoutCropper() {
      if (!currentImage || !cropRect || editor.hidden) return;
      const e = cropEdges();
      const l = Math.min(0, e.l), t = Math.min(0, e.t);
      const r = Math.max(currentImage.width, e.r), b = Math.max(currentImage.height, e.b);
      const margin = Math.max(16, Math.round(0.15 * Math.max(r - l, b - t)));
      view = { x: l - margin, y: t - margin, w: r - l + 2 * margin, h: b - t + 2 * margin };
      const availableWidth = stageWrap.clientWidth || 300;
      const availableHeight = clamp(240, Math.round(window.innerHeight * 0.6), 640);
      scale = Math.min(availableWidth / view.w, availableHeight / view.h, 4);
      stage.style.width = `${view.w * scale}px`;
      stage.style.height = `${view.h * scale}px`;
      positionCropper();
    }

    function placeBox(el, x, y, w, h) {
      el.style.left = `${(x - view.x) * scale}px`;
      el.style.top = `${(y - view.y) * scale}px`;
      el.style.width = `${w * scale}px`;
      el.style.height = `${h * scale}px`;
    }

    function positionCropper() {
      if (!view) return;
      placeBox(sourceImage, 0, 0, currentImage.width, currentImage.height);
      placeBox(imageBackdrop, 0, 0, currentImage.width, currentImage.height);
      placeBox(cropFill, cropRect.x, cropRect.y, cropRect.width, cropRect.height);
      placeBox(cropBox, cropRect.x, cropRect.y, cropRect.width, cropRect.height);
      cropBox.classList.toggle('narrow', cropRect.width * scale < 76);
      cropBox.classList.toggle('short', cropRect.height * scale < 76);
      updateCropReadout();
    }

    function signed(n) {
      return n === 0 ? '0' : n > 0 ? `+${n}` : `−${-n}`;
    }

    function updateCropReadout() {
      const e = cropEdges();
      const growth = { t: -e.t, l: -e.l, r: e.r - currentImage.width, b: e.b - currentImage.height };
      for (const [edge, value] of Object.entries(growth)) {
        nudgePanel.querySelector(`[data-growth="${edge}"]`).textContent = signed(value);
      }
      cropSizeLabel.textContent = `${cropRect.width} × ${cropRect.height}`;
      const unchanged = Object.values(growth).every(v => v === 0);
      cropSizeNote.textContent = unchanged ? 'original size' : `was ${currentImage.width} × ${currentImage.height}`;
      resetCropButton.disabled = unchanged;
    }

    /* ---------- Dragging the crop box, its edges and corners ---------- */
    const SNAP_DISTANCE = 6;       // screen pixels within which an edge snaps to the image edge
    let dragState = null;          // { mode, pointerId, startX, startY, start }

    [cropBox, ...cropBox.children].forEach(el => {
      el.addEventListener('pointerdown', onCropPointerDown);
      el.addEventListener('pointermove', onCropPointerMove);
      el.addEventListener('pointerup', onCropPointerEnd);
      el.addEventListener('pointercancel', onCropPointerEnd);
    });

    function onCropPointerDown(e) {
      if (dragState || !currentImage || (e.pointerType === 'mouse' && e.button !== 0)) return;
      e.preventDefault();
      e.stopPropagation();
      dragState = {
        mode: e.currentTarget.dataset.handle,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        start: cropEdges()
      };
      e.currentTarget.setPointerCapture(e.pointerId);
    }

    function snap(value, imageSize) {
      if (Math.abs(value) * scale <= SNAP_DISTANCE) return 0;
      if (Math.abs(value - imageSize) * scale <= SNAP_DISTANCE) return imageSize;
      return value;
    }

    function onCropPointerMove(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      e.stopPropagation();
      const dx = Math.round((e.clientX - dragState.startX) / scale);
      const dy = Math.round((e.clientY - dragState.startY) / scale);
      const { mode, start } = dragState;
      const imgW = currentImage.width, imgH = currentImage.height;
      // A drag stays inside the stage; the stage grows when it is released.
      const minX = view.x, maxX = view.x + view.w, minY = view.y, maxY = view.y + view.h;
      const e2 = { ...start };

      if (mode === 'move') {
        const w = start.r - start.l, h = start.b - start.t;
        let l = start.l + dx, t = start.t + dy;
        if (snap(l, imgW) !== l) l = snap(l, imgW);
        else if (snap(l + w, imgW) !== l + w) l = snap(l + w, imgW) - w;
        if (snap(t, imgH) !== t) t = snap(t, imgH);
        else if (snap(t + h, imgH) !== t + h) t = snap(t + h, imgH) - h;
        e2.l = clamp(minX, l, maxX - w); e2.r = e2.l + w;
        e2.t = clamp(minY, t, maxY - h); e2.b = e2.t + h;
      } else {
        if (mode.includes('l')) e2.l = clamp(minX, snap(start.l + dx, imgW), start.r - 1);
        if (mode.includes('r')) e2.r = clamp(start.l + 1, snap(start.r + dx, imgW), maxX);
        if (mode.includes('t')) e2.t = clamp(minY, snap(start.t + dy, imgH), start.b - 1);
        if (mode.includes('b')) e2.b = clamp(start.t + 1, snap(start.b + dy, imgH), maxY);
      }

      const before = cropEdges();
      if (e2.l === before.l && e2.t === before.t && e2.r === before.r && e2.b === before.b) return;
      setCropEdges(e2);
      positionCropper();
      scheduleProcess();
    }

    function onCropPointerEnd(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      e.stopPropagation();
      dragState = null;
      layoutCropper();
    }

    /* ---------- Buttons that move one edge a pixel at a time ---------- */
    const ARROW_ROTATION = { up: 0, right: 90, down: 180, left: 270 };
    const NUDGE_PADS = [
      { edge: 't', name: 'top', buttons: [['up', -1], ['down', 1]] },
      { edge: 'l', name: 'left', buttons: [['left', -1], ['right', 1]] },
      { edge: 'r', name: 'right', buttons: [['left', -1], ['right', 1]] },
      { edge: 'b', name: 'bottom', buttons: [['up', -1], ['down', 1]] }
    ];

    NUDGE_PADS.forEach(({ edge, name, buttons }) => {
      const pad = document.createElement('div');
      pad.className = 'nudge-pad';
      pad.style.gridArea = name;
      const label = document.createElement('span');
      label.className = 'nudge-label';
      label.innerHTML = `${name[0].toUpperCase()}${name.slice(1)} <b data-growth="${edge}">0</b>`;
      const group = document.createElement('div');
      group.className = 'nudge-buttons';
      buttons.forEach(([direction, delta]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', `Move ${name} edge ${direction} 1 pixel`);
        button.title = `Move the ${name} edge ${direction} 1px (hold to repeat, Shift for 10px)`;
        button.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true" style="transform: rotate(${ARROW_ROTATION[direction]}deg)"><path d="M3 10.5 8 5.5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        addRepeatingPress(button, shiftKey => nudgeEdge(edge, delta * (shiftKey ? 10 : 1)));
        group.appendChild(button);
      });
      pad.append(label, group);
      nudgePanel.appendChild(pad);
    });

    // Acts once on press, then repeats while the button is held down.
    function addRepeatingPress(button, action) {
      let timer = null;
      const stop = () => { clearTimeout(timer); timer = null; };
      button.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        stop();
        action(e.shiftKey);
        const repeat = () => { action(e.shiftKey); timer = setTimeout(repeat, 50); };
        timer = setTimeout(repeat, 400);
      });
      ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(type => button.addEventListener(type, stop));
      button.addEventListener('contextmenu', e => e.preventDefault());
      // Keyboard activation arrives as a click that no pointer press caused.
      button.addEventListener('click', e => { if (e.detail === 0) action(e.shiftKey); });
    }

    function nudgeEdge(edge, delta) {
      if (!currentImage || dragState) return;
      const e = cropEdges();
      const imgW = currentImage.width, imgH = currentImage.height;
      if (edge === 'l') e.l = clamp(-MAX_EXPAND, e.l + delta, e.r - 1);
      if (edge === 'r') e.r = clamp(e.l + 1, e.r + delta, imgW + MAX_EXPAND);
      if (edge === 't') e.t = clamp(-MAX_EXPAND, e.t + delta, e.b - 1);
      if (edge === 'b') e.b = clamp(e.t + 1, e.b + delta, imgH + MAX_EXPAND);
      setCropEdges(e);
      layoutCropper();
      scheduleProcess();
    }

    resetCropButton.addEventListener('click', () => {
      if (!currentImage) return;
      cropRect = { x: 0, y: 0, width: currentImage.width, height: currentImage.height };
      layoutCropper();
      scheduleProcess();
    });

    // Re-encoding every preview is slow, so wait for a pause in the changes.
    let processTimer = null;
    function scheduleProcess() {
      clearTimeout(processTimer);
      processTimer = setTimeout(() => {
        if (currentImage) processImage(currentImage);
      }, 120);
    }

    function clamp(min, val, max) {
      return Math.max(min, Math.min(val, max));
    }

    /* ---------- Processing: resize qualities based on CROP area (rounded dims) ---------- */
    function processImage(img, options = {}) {
      const generation = ++renderGeneration;
      if (renderAbortController) renderAbortController.abort();
      renderAbortController = new AbortController();
      const { signal } = renderAbortController;
      const format = OUTPUT_FORMATS[activeFormat];
      if (!format) return;

      const qualities = format.qualityValues;
      const preserveScroll = options.preserveScroll === true;
      const scrollState = options.scrollState || (preserveScroll ? captureScrollState() : null);

      if (preserveScroll) {
        output.style.minHeight = `${Math.max(output.offsetHeight, Number.parseFloat(output.style.minHeight) || 0)}px`;
      } else {
        output.style.minHeight = '';
      }

      revokeOutputUrls();
      output.innerHTML = '';
      if (preserveScroll) maintainScrollPosition(scrollState);
      if (!cropRect) return;

      const roundedCropW = Math.max(1, Math.round(cropRect.width));
      const roundedCropH = Math.max(1, Math.round(cropRect.height));

      const widths = [
        roundedCropW,
        Math.max(1, Math.round(roundedCropW / 2))
      ];
      let pendingOutputItems = widths.length * qualities.length;

      function finishOutputItem() {
        if (!preserveScroll) return;

        maintainScrollPosition(scrollState);
        requestAnimationFrame(() => {
          maintainScrollPosition(scrollState);
          pendingOutputItems--;
          if (pendingOutputItems === 0 && generation === renderGeneration) {
            releaseOutputHeightReservation(scrollState);
          }
        });
      }

      widths.forEach(w => {
        const h = Math.max(1, Math.round(roundedCropH * (w / roundedCropW)));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        // Where the whole image lands on this canvas. Parts outside the canvas
        // are cropped away; parts of the canvas it misses are new space.
        const dx = Math.round(-cropRect.x * (w / roundedCropW));
        const dy = Math.round(-cropRect.y * (h / roundedCropH));
        const dw = Math.max(1, Math.round(img.width * (w / roundedCropW)));
        const dh = Math.max(1, Math.round(img.height * (h / roundedCropH)));
        const hasNewSpace = dx > 0 || dy > 0 || dx + dw < w || dy + dh < h;

        if (!format.supportsAlpha || (hasNewSpace && !background.transparent)) {
          ctx.fillStyle = background.color;
          ctx.fillRect(0, 0, w, h);
          // Formats with alpha keep the image's own transparency.
          if (format.supportsAlpha && imageHasAlpha) ctx.clearRect(dx, dy, dw, dh);
        }

        // Every quality level is encoded from this same, unchanging canvas.
        const sw = roundedCropW;
        const sh = roundedCropH;
        ctx.drawImage(img, dx, dy, dw, dh);

        qualities.forEach(quality => {
          const container = document.createElement('div');
          container.className = 'image-container';
          container.textContent = `Encoding ${format.label}…`;
          output.appendChild(container);

          createOutputBlob(canvas, format, quality, signal, blob => {
            if (generation !== renderGeneration) return;
            if (!blob) {
              container.textContent = `Unable to generate ${format.label}.`;
              finishOutputItem();
              return;
            }

            const url = URL.createObjectURL(blob);
            outputUrls.push(url);

            const resultImg = document.createElement('img');
            resultImg.src = url;
            resultImg.width = w;
            resultImg.height = h;
            resultImg.alt = `Resized ${format.label} preview ${w}px${quality === null ? '' : ` q${quality.toFixed(1)}`}`;
            resultImg.addEventListener('click', () => {
              resultImg.classList.toggle('full-width');
            });

            const infoDiv = document.createElement('div');
            infoDiv.className = 'image-info';
            infoDiv.innerHTML = `
              Format: ${format.label}<br>
              Width: ${w}px<br>
              ${quality === null ? '' : `Quality: ${quality.toFixed(1)}<br>`}
              Size: ${(blob.size / 1024).toFixed(2)} KB
            `;

            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = `image_crop_${sw}x${sh}_w${w}${quality === null ? '' : `_q${quality.toFixed(1)}`}.${format.extension}`;
            downloadLink.textContent = 'Download';

            container.textContent = '';
            container.appendChild(resultImg);
            container.appendChild(infoDiv);
            container.appendChild(downloadLink);
            finishOutputItem();
          });
        });
      });
    }

    function releaseOutputHeightReservation(scrollState) {
      const reservedMinHeight = output.style.minHeight;
      if (!reservedMinHeight) return;

      output.style.minHeight = '';

      const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      const currentDocumentHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      const maxScrollY = Math.max(0, currentDocumentHeight - viewportHeight);

      if (maxScrollY >= scrollState.y) {
        window.scrollTo(scrollState.x, scrollState.y);
      } else {
        output.style.minHeight = reservedMinHeight;
        maintainScrollPosition(scrollState);
      }
    }

    function createOutputBlob(canvas, format, quality, signal, callback) {
      if (format.mime === 'image/webp' && !nativeEncodeSupported.webp) {
        // Copy the pixels now, before the async encoder loads.
        const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        const webpQuality = Math.round(clamp(0, quality === null ? 0.75 : quality, 1) * 100);
        loadJsquashWebpEncoder()
          .then(encode => encode(imageData, { quality: webpQuality }))
          .then(buffer => callback(new Blob([buffer], { type: 'image/webp' })))
          .catch(err => {
            console.error('WebP encoding failed', err);
            callback(null);
          });
        return;
      }

      if (format.mime === 'image/avif' && !nativeEncodeSupported.avif) {
        encodeAvifWithWasm(canvas, quality === null ? 0.5 : quality, signal).then(callback, err => {
          if (err.name !== 'AbortError') console.error('AVIF encoding failed', err);
          callback(null);
        });
        return;
      }

      if (!canvas.toBlob) {
        callback(null);
        return;
      }

      canvas.toBlob(blob => {
        callback(blob && blob.type === format.mime ? blob : null);
      }, format.mime, quality === null ? undefined : quality);
    }

    function revokeOutputUrls() {
      outputUrls.forEach(url => URL.revokeObjectURL(url));
      outputUrls = [];
    }
  </script>
</body>
</html>
