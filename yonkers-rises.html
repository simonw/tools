<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yonkers Rises</title>

<style>
:root{
  /* layout: full-bleed 3D map diorama; readouts pinned top-left, controls bottom */
  --sky-top:#f4f6f1;
  --sky-bottom:#c6d9e1;
  --ink:#1e2a35;
  --ink-soft:#566673;
  --panel:rgba(255,255,255,.82);
  --accent:#e8622a;
  --font-display:"Chakra Petch","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--font-body);overflow:hidden}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#scene:active{cursor:grabbing}
.hud{position:fixed;left:16px;right:16px;pointer-events:none;display:flex;gap:12px}
.hud.top{top:16px;justify-content:space-between;align-items:flex-start}
.hud.bottom{bottom:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.card{background:var(--panel);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:0;line-height:1.1}
#status{font-family:var(--font-display);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:4px;min-height:1.2em}
.stats{display:flex;gap:16px;font-family:var(--font-display);text-align:right}
.stat{white-space:nowrap}
.stat b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.controls{display:flex;gap:8px;pointer-events:auto}
button{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:10px 16px;min-width:92px;cursor:pointer}
button:hover{background:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.credit{font-size:11px;line-height:1.4;color:var(--ink-soft);pointer-events:auto;max-width:34ch}
.credit a{color:var(--ink)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px}
</style>
</head>

</div>

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function wrap(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}

(function buildMap(){

/* ---------- flat map labels ---------- */
function textCanvas(text,color,size){
  const c=document.createElement('canvas');const g=c.getContext('2d');
  const font='700 '+size+'px "Chakra Petch","Avenir Next Condensed","Segoe UI",sans-serif';
  g.font=font;const sp=size*0.22;let w=0;for(const ch of text)w+=g.measureText(ch).width+sp;
  c.width=Math.ceil(w+size*0.4);c.height=Math.ceil(size*1.4);
  g.font=font;g.fillStyle=color;g.textBaseline='middle';
  let x=size*0.2+sp/2;for(const ch of text){g.fillText(ch,x,c.height/2);x+=g.measureText(ch).width+sp;}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return {tex:t,aspect:c.width/c.height};
}
function labelMesh(text,height,color){
  const tc=textCanvas(text,color,96);

}

const bld=(function(){

const DOWN=new THREE.Vector3(0,-1,0),_v=new THREE.Vector3(),_d=new THREE.Vector3(),_p=new THREE.Vector3(),_k=new THREE.Vector3(),_s=new THREE.Vector3();
const _q=new THREE.Quaternion(),_qi=new THREE.Quaternion(),_qw=new THREE.Quaternion(),_qf=new THREE.Quaternion(),_e=new THREE.Euler(0,0,0,'YXZ'),QID=new THREE.Quaternion();
function solveLegs(){
  root.updateMatrixWorld(true);
  _qi.copy(root.quaternion).invert();
  for(const L of legs){
    _v.copy(L.pos);root.worldToLocal(_v);
    _d.set(_v.x-L.hipX,_v.y,_v.z);
    let len=_d.length();if(len<1e-4){_d.set(0,-1,0);len=1;}
    const dist=Math.min(len,LEG-1e-3);_d.multiplyScalar(1/len);

    if(_p.lengthSq()<1e-6)_p.set(0,0,1);_p.normalize();
    _k.copy(_d).multiplyScalar(cosA).addScaledVector(_p,sinA).normalize();
    L.thG.quaternion.setFromUnitVectors(DOWN,_k);
    _s.copy(_d).multiplyScalar(dist).addScaledVector(_k,-LT).normalize();
    _q.copy(L.thG.quaternion).invert();_s.applyQuaternion(_q);
    L.snG.quaternion.setFromUnitVectors(DOWN,_s);

}

const fx=(function(){
  const N=1400,pos=new Float32Array(N*3),col=new Float32Array(N*3),vel=new Float32Array(N*3),life=new Float32Array(N);
  for(let i=0;i<N;i++)pos[i*3+1]=-50;
  const dc=document.createElement('canvas');dc.width=dc.height=64;const g=dc.getContext('2d');
  const gr=g.createRadialGradient(32,32,2,32,32,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.75,map:new THREE.CanvasTexture(dc),vertexColors:true,transparent:true,opacity:0.8,depthWrite:false}));

    const m=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));m.visible=false;scene.add(m);rings.push({m,t:1,size:6});}

/* ---------- stand-up choreography (seconds) ---------- */
const T_WALK=11.9,STAND_F=2.6,STAND_H=4.35;

const colA=new THREE.Color(C.skin0),colB=new THREE.Color(C.skin1);

  const ph=track(K.ph,t),pf=track(K.pf,t),pitch=track(K.pitch,t)*Math.PI/180;

/* ---------- stomping tour ---------- */
const WP=[[2.1,-13.0],[-1.2,-5.9],[-3.1,-2.2],[-4.6,0.7],[-6.3,5.2],[-4.2,7.8],[-2.9,11.0],[0.2,13.2],[3.8,10.4],[7.2,4.6],[7.0,1.6],[3.8,0.5],[0.9,-1.2],[-0.9,-3.9]];
const WP_LOOP=2,STEP=0.85,SWING=0.55,SPEED=2.8;
function startWalk(){
  W={x:P0.x+FWD0.x*STAND_F,z:P0.z+FWD0.z*STAND_F,yaw:PSI,v:0,wp:0,clock:0.55,next:0,bob:0,bobV:0,sway:0,arm:0,look:0};
  for(const L of legs){L.swing=null;L.flat=1;}
}
function walk(dt){
  const tgt=WP[W.wp],dx=tgt[0]-W.x,dz=tgt[1]-W.z;
  if(dx*dx+dz*dz<2.4*2.4){W.wp++;if(W.wp>=WP.length)W.wp=WP_LOOP;}
  const diff=wrap(Math.atan2(dx,dz)-W.yaw),rate=Math.max(-0.85,Math.min(0.85,diff*1.6));
  W.yaw+=rate*dt;
  const vT=SPEED*(1-0.55*Math.min(1,Math.abs(diff)/1.3));W.v+=(vT-W.v)*Math.min(1,dt*1.4);
  const fx_=Math.sin(W.yaw),fz_=Math.cos(W.yaw),rx=Math.cos(W.yaw),rz=-Math.sin(W.yaw);
  W.x+=fx_*W.v*dt;W.z+=fz_*W.v*dt;
  W.clock+=dt;
  if(W.clock>=STEP){W.clock=0;const L=legs[W.next];W.next=1-W.next;
    const yaw1=W.yaw+rate*SWING,f1x=Math.sin(yaw1),f1z=Math.cos(yaw1),lead=W.v*SWING+0.56*W.v+0.15;
    L.swing={t:0,fx:L.pos.x,fz:L.pos.z,tx:W.x+f1x*lead+Math.cos(yaw1)*L.hipX*1.12,tz:W.z+f1z*lead-Math.sin(yaw1)*L.hipX*1.12,y0:L.yaw,y1:yaw1};}
  let swaying=0;
  for(const L of legs){const s=L.swing;if(!s){L.pos.y=ANKLE_GROUND;continue;}
    s.t+=dt/SWING;const u=Math.min(1,s.t),e=u*u*(3-2*u);
    L.pos.x=s.fx+(s.tx-s.fx)*e;L.pos.z=s.fz+(s.tz-s.fz)*e;
    L.pos.y=ANKLE_GROUND+2.0*Math.pow(Math.sin(Math.PI*Math.pow(u,0.8)),0.9);
    L.yaw=s.y0+wrap(s.y1-s.y0)*e;swaying=-L.sgn;
    if(u>=1){L.pos.y=ANKLE_GROUND;L.swing=null;W.bobV-=2.4;stomp(L,1);}}
  W.sway+=(swaying*0.42-W.sway)*Math.min(1,dt*4);
  W.bobV+=(-70*W.bob-9*W.bobV)*dt;W.bob+=W.bobV*dt;
  W.arm+=dt*Math.PI/STEP;
  root.position.set(W.x+rx*W.sway,STAND_H+W.bob,W.z+rz*W.sway);
  root.rotation.set(0.07-W.bob*0.12,W.yaw,-W.sway*0.07);
  const sw=Math.sin(W.arm),amp=0.5*Math.min(1,W.v/SPEED+0.2);
  torsoG.rotation.set(0.04,sw*0.13,0);
  arms[0].shG.rotation.set(sw*amp,0,-0.14);arms[1].shG.rotation.set(-sw*amp,0,0.14);
  arms[0].elG.rotation.set(-0.35-0.3*Math.max(0,-sw),0,0);arms[1].elG.rotation.set(-0.35-0.3*Math.max(0,sw),0,0);
  W.look+=(Math.max(-0.6,Math.min(0.6,diff))-W.look)*Math.min(1,dt*3);
  headG.rotation.set(0.05,W.look,0);
  const pulse=0.75+0.25*Math.sin(time*5);
  glowMat.emissiveIntensity=1.3*pulse;coreMat.emissiveIntensity=1.1*pulse;
  skinMat.emissiveIntensity=0;sideMat.emissiveIntensity=0.3*pulse;
  hud.height.textContent=(M.H+FOOT_H).toFixed(1)+' km';
}

/* ---------- camera ---------- */
const cam={az:PSI+0.5,el:1.0,dist:30,t:new THREE.Vector3(P0.x+FWD0.x*-2,0,P0.z+FWD0.z*-2),init:false};
const user={az:0,el:0,zoom:1};
const CK={el:[[0,1.02],[2.6,0.8],[6,0.36],[9,0.2],[10.2,0.14],[11.9,0.24]],dist:[[0,27],[2.6,24],[7,24],[10.2,21],[11.9,27]],
  az:[[0,0.55],[5,0.25],[10.2,-0.38],[11.9,0.2]],ty:[[2.6,0],[6,1.2],[8.8,3],[10.2,5.2]]};
const _ct=new THREE.Vector3();
function updateCamera(dt){
  let az,el,dist;
  if(!W){az=PSI+track(CK.az,time);el=track(CK.el,time);dist=track(CK.dist,time);
    _ct.set(root.position.x-FWD0.x*(time<7?2.2:0),track(CK.ty,time),root.position.z-FWD0.z*(time<7?2.2:0));
    if(time<7){_ct.x=P0.x-FWD0.x*2.4;_ct.z=P0.z-FWD0.z*2.4;}}
  else{az=W.yaw+0.75;el=0.3;dist=31;_ct.set(W.x,5.0,W.z);}
  const portrait=camera.aspect<1?1+(1-camera.aspect)*0.75:1;
  const k=cam.init?1-Math.exp(-dt*(W?1.3:6)):1;cam.init=true;
  cam.az+=wrap(az-cam.az)*(W?1-Math.exp(-dt*0.7):k);cam.el+=(el-cam.el)*k;cam.dist+=(dist-cam.dist)*k;
  cam.t.lerp(_ct,W?1-Math.exp(-dt*2.2):k);
  const a=cam.az+user.az,e=Math.max(0.06,Math.min(1.45,cam.el+user.el)),d=cam.dist*user.zoom*portrait;
  camera.position.set(cam.t.x+Math.sin(a)*Math.cos(e)*d,cam.t.y+Math.sin(e)*d,cam.t.z+Math.cos(a)*Math.cos(e)*d);
  if(shake>0.001&&!reduceMotion){const s=shake*0.28;camera.position.x+=(Math.random()-0.5)*s;camera.position.y+=(Math.random()-0.5)*s;camera.position.z+=(Math.random()-0.5)*s;}
  camera.lookAt(cam.t);
  sun.target.position.set(root.position.x,0,root.position.z);sun.position.set(root.position.x-17,36,root.position.z+13);
}

/* ---------- loop ---------- */
function advance(dt){
  time+=dt;
  if(time<T_WALK)standUp(time);else{if(!W)startWalk();walk(dt);}
  solveLegs();
  fx.update(dt);
  shake*=Math.exp(-dt*3.2);
  updateCamera(dt);
}
function reset(){time=0;W=null;stomps=0;shake=0;hud.stomps.textContent='0';for(const k in fired)delete fired[k];
  for(const L of legs)L.swing=null;bld.reset();fx.clear();cam.init=false;advance(0);}
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

const pauseBtn=document.getElementById('pause');
function setPaused(p){paused=p;pauseBtn.textContent=p?'Play':'Pause';}
pauseBtn.addEventListener('click',()=>setPaused(!paused));
document.getElementById('replay').addEventListener('click',()=>{reset();setPaused(false);});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();setPaused(!paused);}});

const ptrs=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){const p=[...ptrs.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(ptrs.size===1){user.az-=dx*0.006;user.el=Math.max(-1.2,Math.min(1.3,user.el+dy*0.005));}
  else if(ptrs.size===2){const q=[...ptrs.values()],d=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);if(pinch>0)user.zoom=Math.max(0.35,Math.min(2.6,user.zoom*pinch/d));pinch=d;}});
function up(e){ptrs.delete(e.pointerId);pinch=0;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();user.zoom=Math.max(0.35,Math.min(2.6,user.zoom*Math.exp(e.deltaY*0.001)));},{passive:false});

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!paused)advance(dt);else updateCamera(dt);renderer.render(scene,camera);requestAnimationFrame(frame);}
window.__seek=function(t){reset();while(time<t)advance(1/60);renderer.render(scene,camera);};
const fontReady=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('700 96px "Chakra Petch"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.catch(()=>{}).then(()=>{buildLabels();});
reset();requestAnimationFrame(frame);
})();
</script>
</body>
