<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quick Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a studio wall. Settings run across the top, the painting hangs centred, a museum-style label and brush log sit beneath it. */
:root {
  --wall: #e2e6e9;
  --panel: #f2f4f5;
  --ink: #15212c;
  --muted: #566573;
  --accent: #946510;
  --accent-soft: rgba(148, 101, 16, .14);
  --line: rgba(21, 33, 44, .15);
  --shadow: rgba(14, 22, 30, .32);
  --f-display: 'Gloock', Georgia, 'Times New Roman', serif;
  --f-body: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #0f171e; --panel: #16212a; --ink: #e8e3d6; --muted: #95a2ad;
    --accent: #d8a544; --accent-soft: rgba(216, 165, 68, .17);
    --line: rgba(232, 227, 214, .14); --shadow: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #0f171e; --panel: #16212a; --ink: #e8e3d6; --muted: #95a2ad;
  --accent: #d8a544; --accent-soft: rgba(216, 165, 68, .17);
  --line: rgba(232, 227, 214, .14); --shadow: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--wall); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.brand { min-width: 0; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  font: 500 14px/1 var(--f-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--wall); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible, .seg input:focus-visible + span, select:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px;
  padding-block: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { border: 0; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.seg legend { float: left; margin-right: 10px; }
.seg .opts { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--muted); transition: background .15s, color .15s; }
.seg input:checked + span { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.field { display: flex; align-items: center; gap: 10px; }
select {
  font: 500 13.5px var(--f-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
input[type=range] { accent-color: var(--accent); width: 120px; }
output { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
#compare { margin-left: auto; user-select: none; -webkit-user-select: none; touch-action: none; }
#compare.on { background: var(--accent-soft); border-color: var(--accent); }

.wall { position: relative; display: flex; justify-content: center; padding-block: 10px 0; min-height: 200px; }
.piece { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; max-width: 100%; }
.frame {
  position: relative; line-height: 0; max-width: 100%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 3px rgba(0,0,0,.12), 0 22px 44px -20px var(--shadow);
}
.frame canvas { display: block; max-width: 100%; }
.frame .layer, .texture { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.texture { mix-blend-mode: multiply; opacity: var(--tex-op, .4); background-repeat: repeat; }
figcaption { font-family: var(--f-mono); font-size: 12px; line-height: 1.55; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
figcaption b { font-family: var(--f-body); font-size: 14px; font-weight: 600; color: var(--ink); display: block; }

.drop {
  position: absolute; inset: 0; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--wall) 82%, transparent);
  font-family: var(--f-display); font-size: 1.6rem; color: var(--ink); z-index: 3;
}
.log { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); }
#status { margin: 0; font: 400 12.5px/1.5 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#status strong { color: var(--ink); font-weight: 500; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  #compare { margin-left: 0; }
  .seg legend { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .seg span { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Quick Study</h1>
      <p>Open a photo and watch it painted stroke by stroke, coarse brushes first, fine ones last.</p>
    </div>
    <div class="actions">
      <button id="open" class="btn primary" type="button">Open photo</button>
      <button id="again" class="btn" type="button">Repaint</button>
      <button id="save" class="btn" type="button" hidden>Download PNG</button>
      <input type="file" id="file" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">
    </div>
  </header>

  <section class="controls" aria-label="Painting settings">
    <fieldset class="seg">
      <legend class="label">Medium</legend>
      <div class="opts">
        <label><input type="radio" name="medium" id="m-oil" value="oil" checked><span>Oil</span></label>
        <label><input type="radio" name="medium" id="m-water" value="water"><span>Watercolor</span></label>
        <label><input type="radio" name="medium" id="m-point" value="point"><span>Pointillist</span></label>
      </div>
    </fieldset>
    <label class="field"><span class="label">Detail</span>
      <select id="detail">
        <option value="3">Loose</option>
        <option value="4" selected>Balanced</option>
        <option value="5">Fine</option>
      </select>
    </label>
    <label class="field"><span class="label">Time</span>
      <input type="range" id="dur" min="2" max="10" step="1" value="4">
      <output id="durOut" for="dur">4 s</output>
    </label>
    <button id="compare" class="btn" type="button">Hold to see photo</button>
  </section>

  <section class="wall" id="stage">
    <figure class="piece">
      <div class="frame">
        <canvas id="paint" width="10" height="10" aria-label="Painted version of the photo"></canvas>
        <div class="texture" id="texture"></div>
        <canvas id="orig" class="layer" width="10" height="10" hidden></canvas>
        <canvas id="cursor" class="layer" width="10" height="10"></canvas>
      </div>
      <figcaption id="caption"></figcaption>
    </figure>
    <div class="drop" id="drop" hidden>Drop to paint this photo</div>
  </section>

  <footer class="log">
    <div class="bar"><span id="bar"></span></div>
    <p id="status" aria-live="polite">Preparing the canvas…</p>
    <p class="hint">You can also drag a photo onto the painting or paste one from your clipboard.</p>
  </footer>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const paint = $('#paint'), orig = $('#orig'), cursor = $('#cursor');
  const pctx = paint.getContext('2d');
  const octx = orig.getContext('2d', { willReadFrequently: true });
  const cctx = cursor.getContext('2d');
  const stage = $('#stage'), statusEl = $('#status'), barEl = $('#bar'), caption = $('#caption'), texture = $('#texture');

  const LONG = 1000;
  let W = 0, H = 0, src = null, job = null, sourceName = '';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;

  // ---------- textures (laid over the painting in CSS, not baked in) ----------
  function weaveTile() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), r = mulberry32(3);
    x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 64; i += 2) {
      x.fillStyle = `rgba(70,58,44,${.05 + r() * .08})`; x.fillRect(0, i, 64, 1);
      x.fillStyle = `rgba(70,58,44,${.04 + r() * .07})`; x.fillRect(i, 0, 1, 64);
    }
    for (let k = 0; k < 70; k++) { x.fillStyle = `rgba(70,58,44,${r() * .1})`; x.fillRect(r() * 64 | 0, r() * 64 | 0, 1 + (r() * 3 | 0), 1); }
    return c;
  }
  function grainTile() {
    const c = document.createElement('canvas'); c.width = c.height = 120;
    const x = c.getContext('2d'), d = x.createImageData(120, 120), r = mulberry32(11);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = 255 - (r() * r()) * 70;
      d.data[i] = v; d.data[i + 1] = v; d.data[i + 2] = v - 4; d.data[i + 3] = 255;
    }
    x.putImageData(d, 0, 0); return c;
  }
  const TEX = { weave: weaveTile(), grain: grainTile() };
  const TEXURL = { weave: TEX.weave.toDataURL(), grain: TEX.grain.toDataURL() };

  // ---------- media ----------
  const MEDIA = {
    oil:   { ground: '#cbbd9f', maxLen: 9, minLen: 2, T: 22, grid: 1.0, tex: 'weave', texOp: .42, label: 'Oil on toned linen' },
    water: { ground: '#f7f4ec', maxLen: 6, minLen: 1, T: 18, grid: 1.0, tex: 'grain', texOp: .6,  label: 'Watercolor on cold-press paper' },
    point: { ground: '#eee8db', maxLen: 0, minLen: 0, T: 16, grid: 0.8, tex: 'grain', texOp: .35, label: 'Pointillist dots on primed canvas' }
  };
  const PLANS = {
    3: { div: [16, 34, 70], w: [.30, .34, .36] },
    4: { div: [16, 34, 70, 130], w: [.17, .23, .28, .32] },
    5: { div: [16, 34, 70, 130, 240], w: [.11, .16, .21, .25, .27] }
  };
  function brushName(r) {
    const w = r * 2;
    if (w >= 100) return 'No. 24 flat';
    if (w >= 50) return 'No. 16 flat';
    if (w >= 26) return 'No. 10 filbert';
    if (w >= 14) return 'No. 6 round';
    if (w >= 8) return 'No. 2 round';
    return 'No. 0 rigger';
  }

  // ---------- image analysis ----------
  function blur1(a, w, h, r) {
    const t = new Float32Array(w * h), o = new Float32Array(w * h), d = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      const row = y * w; let s = 0;
      for (let i = -r; i <= r; i++) s += a[row + Math.min(w - 1, Math.max(0, i))];
      for (let x = 0; x < w; x++) {
        t[row + x] = s / d;
        s += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) s += t[Math.min(h - 1, Math.max(0, i)) * w + x];
      for (let y = 0; y < h; y++) {
        o[y * w + x] = s / d;
        s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x];
      }
    }
    return o;
  }
  function sobel(l, w, h) {
    const gx = new Float32Array(w * h), gy = new Float32Array(w * h);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = l[i - w - 1], b = l[i - w], c = l[i - w + 1], d = l[i - 1], f = l[i + 1], g = l[i + w - 1], hh = l[i + w], k = l[i + w + 1];
      gx[i] = (c + 2 * f + k) - (a + 2 * d + g);
      gy[i] = (g + 2 * hh + k) - (a + 2 * b + c);
    }
    return { gx, gy };
  }

  function loadSource(drawable, name) {
    const iw = drawable.naturalWidth || drawable.width, ih = drawable.naturalHeight || drawable.height;
    if (!iw || !ih) { setStatus('That image has no pixels to paint. Try another file.'); return; }
    const s = LONG / Math.max(iw, ih);
    W = Math.max(8, Math.round(iw * s)); H = Math.max(8, Math.round(ih * s));
    for (const c of [paint, orig, cursor]) { c.width = W; c.height = H; }
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(drawable, 0, 0, W, H);
    const data = octx.getImageData(0, 0, W, H).data;
    const n = W * H, R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n), L = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      R[i] = data[j]; G[i] = data[j + 1]; B[i] = data[j + 2];
      L[i] = .299 * R[i] + .587 * G[i] + .114 * B[i];
    }
    const lS = blur1(blur1(L, W, H, 2), W, H, 2);
    const lL = blur1(blur1(L, W, H, 7), W, H, 7);
    src = { R, G, B, gS: sobel(lS, W, H), gL: sobel(lL, W, H), refs: new Map() };
    sourceName = name;
    fit();
    start();
  }
  function refFor(rad) {
    if (!src.refs.has(rad)) {
      src.refs.set(rad, rad < 1
        ? { r: src.R, g: src.G, b: src.B }
        : { r: blur1(src.R, W, H, rad), g: blur1(src.G, W, H, rad), b: blur1(src.B, W, H, rad) });
    }
    return src.refs.get(rad);
  }

  // ---------- painting job ----------
  const medium = () => document.querySelector('input[name=medium]:checked').value;
  const detail = () => +$('#detail').value;
  const duration = () => +$('#dur').value * 1000;

  function start() {
    if (!src) return;
    const m = MEDIA[medium()], plan = PLANS[detail()];
    const seed = (Math.random() * 1e9) | 0;
    const rng = mulberry32(seed);
    const L = Math.max(W, H);
    job = {
      m, mediumKey: medium(), rng, plan,
      radii: plan.div.map(d => Math.max(2.2, L / d)),
      D: duration(), pass: -1, P: null, total: 0,
      t0: performance.now(), hand: -0.6 + (rng() - .5) * .5, last: null
    };
    // ground
    pctx.globalCompositeOperation = 'source-over';
    pctx.globalAlpha = 1; pctx.fillStyle = m.ground; pctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 2500; i++) {
      pctx.globalAlpha = rng() * .06; pctx.fillStyle = rng() < .5 ? '#000' : '#fff';
      pctx.fillRect(rng() * W, rng() * H, 1 + rng() * 3, 1 + rng() * 2);
    }
    texture.style.backgroundImage = `url(${TEXURL[m.tex]})`;
    texture.style.setProperty('--tex-op', m.texOp);
    writeCaption();
    nextPass(job);
    const me = job;
    requestAnimationFrame(t => tick(me, t));
  }

  function planPass(J, p) {
    const r = J.radii[p], m = J.m;
    const ref = refFor(Math.max(0, Math.round(r * .45)));
    const cur = pctx.getImageData(0, 0, W, H).data;
    const step = Math.max(2, Math.round(r * m.grid * (p === 0 ? .8 : 1)));
    const T = p === 0 ? -1 : m.T;
    const sub = Math.max(1, Math.floor(step / 3));
    const pts = [];
    for (let gy = 0; gy < H; gy += step) for (let gx = 0; gx < W; gx += step) {
      let sum = 0, n = 0, best = -1, bx = gx, by = gy;
      const ye = Math.min(H, gy + step), xe = Math.min(W, gx + step);
      for (let y = gy; y < ye; y += sub) for (let x = gx; x < xe; x += sub) {
        const i = y * W + x, j = i * 4;
        const dr = cur[j] - ref.r[i], dg = cur[j + 1] - ref.g[i], db = cur[j + 2] - ref.b[i];
        const e = Math.sqrt(dr * dr + dg * dg + db * db);
        sum += e; n++;
        if (e > best) { best = e; bx = x; by = y; }
      }
      if (sum / n > T) {
        if (p === 0) pts.push(Math.min(W - 1, gx + J.rng() * step), Math.min(H - 1, gy + J.rng() * step));
        else pts.push(bx, by);
      }
    }
    // shuffle point pairs
    const k = pts.length / 2;
    for (let i = k - 1; i > 0; i--) {
      const j = (J.rng() * (i + 1)) | 0;
      let t = pts[2 * i]; pts[2 * i] = pts[2 * j]; pts[2 * j] = t;
      t = pts[2 * i + 1]; pts[2 * i + 1] = pts[2 * j + 1]; pts[2 * j + 1] = t;
    }
    return { r, ref, cur, pts, count: k, idx: 0, grad: r > Math.max(W, H) / 45 ? src.gL : src.gS };
  }

  function nextPass(J) {
    J.pass++;
    if (J.pass >= J.radii.length) { J.P = null; return false; }
    J.P = planPass(J, J.pass);
    J.passStart = performance.now();
    J.passDur = J.D * J.plan.w[J.pass];
    return true;
  }

  function strokePath(J, P, x0, y0) {
    const { ref, cur, r, grad } = P, m = J.m;
    let i = (y0 | 0) * W + (x0 | 0);
    const cr = ref.r[i], cg = ref.g[i], cb = ref.b[i];
    const pts = [x0, y0];
    if (m.maxLen === 0) return { pts, c: [cr, cg, cb] };
    let x = x0, y = y0, ldx = 0, ldy = 0;
    const stepLen = r * .8;
    for (let k = 1; k <= m.maxLen; k++) {
      i = (y | 0) * W + (x | 0);
      if (k > 1) {
        const ar = ref.r[i] - cr, ag = ref.g[i] - cg, ab = ref.b[i] - cb;
        const dRef = ar * ar + ag * ag + ab * ab;
        if (dRef > 48 * 48) break; // crossed an edge
        if (k > m.minLen) {
          const j = i * 4, br = ref.r[i] - cur[j], bg = ref.g[i] - cur[j + 1], bb = ref.b[i] - cur[j + 2];
          if (dRef > br * br + bg * bg + bb * bb) break; // canvas already closer than this paint
        }
      }
      let gx = grad.gx[i], gy = grad.gy[i];
      const mag = Math.hypot(gx, gy);
      let dx, dy;
      if (mag > 6) { dx = -gy / mag; dy = gx / mag; }
      else if (k === 1) { const a = J.hand + (J.rng() - .5) * .7; dx = Math.cos(a); dy = Math.sin(a); }
      else { dx = ldx; dy = ldy; }
      if (ldx * dx + ldy * dy < 0) { dx = -dx; dy = -dy; }
      if (k > 1) {
        dx = .55 * dx + .45 * ldx; dy = .55 * dy + .45 * ldy;
        const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
      }
      x += stepLen * dx; y += stepLen * dy;
      if (x < 0 || y < 0 || x >= W || y >= H) break;
      pts.push(x, y); ldx = dx; ldy = dy;
    }
    if (pts.length === 2) {
      const i0 = (y0 | 0) * W + (x0 | 0), gx = grad.gx[i0], gy = grad.gy[i0], mag = Math.hypot(gx, gy);
      let dx, dy;
      if (mag > 6) { dx = -gy / mag; dy = gx / mag; } else { dx = Math.cos(J.hand); dy = Math.sin(J.hand); }
      pts.unshift(x0 - dx * r * .3, y0 - dy * r * .3);
      pts.push(x0 + dx * r * .3, y0 + dy * r * .3);
      pts.splice(2, 2);
    }
    return { pts, c: [cr, cg, cb] };
  }

  function trace(ctx, p) {
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    if (p.length <= 4) { ctx.lineTo(p[p.length - 2], p[p.length - 1]); return; }
    for (let i = 2; i < p.length - 2; i += 2) {
      ctx.quadraticCurveTo(p[i], p[i + 1], (p[i] + p[i + 2]) / 2, (p[i + 1] + p[i + 3]) / 2);
    }
    ctx.lineTo(p[p.length - 2], p[p.length - 1]);
  }

  function drawOil(ctx, s, r, rng) {
    const P = s.pts, n = P.length / 2, w = r * 2, [R, G, B] = s.c;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = .9; ctx.strokeStyle = rgb(R, G, B); ctx.lineWidth = w * .78;
    trace(ctx, P); ctx.stroke();
    const nx = new Float32Array(n), ny = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const a = Math.max(0, k - 1), b = Math.min(n - 1, k + 1);
      const tx = P[2 * b] - P[2 * a], ty = P[2 * b + 1] - P[2 * a + 1], m = Math.hypot(tx, ty) || 1;
      nx[k] = -ty / m; ny[k] = tx / m;
    }
    const nb = Math.max(3, Math.min(12, Math.round(w / 5)));
    const bw = Math.max(1, w / nb * 1.15);
    const buf = new Array(P.length);
    for (let b = 0; b < nb; b++) {
      const rel = (b + .5) / nb - .5 + (rng() - .5) / nb;
      const o = rel * w * .92;
      const sh = (rng() - .5) * 30 + (rng() < .14 ? 28 : 0);
      ctx.strokeStyle = rgb(R + sh + (rng() - .5) * 10, G + sh + (rng() - .5) * 10, B + sh + (rng() - .5) * 10);
      ctx.globalAlpha = .45 + rng() * .45;
      ctx.lineWidth = bw * (.7 + rng() * .6);
      for (let k = 0; k < n; k++) { buf[2 * k] = P[2 * k] + nx[k] * o; buf[2 * k + 1] = P[2 * k + 1] + ny[k] * o; }
      if (n >= 2) {
        const edge = Math.abs(rel) * 2, ts = edge * .45 * rng(), te = edge * .45 * rng(), e = 2 * (n - 1);
        buf[0] += (buf[2] - buf[0]) * ts; buf[1] += (buf[3] - buf[1]) * ts;
        buf[e] += (buf[e - 2] - buf[e]) * te; buf[e + 1] += (buf[e - 1] - buf[e + 1]) * te;
      }
      trace(ctx, buf); ctx.stroke();
    }
  }

  function drawWater(ctx, s, r, rng, pass) {
    const [R, G, B] = s.c, w = r * 2, a = pass === 0 ? .55 : .3;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = a; ctx.strokeStyle = rgb(R, G, B); ctx.lineWidth = w * 1.2;
    trace(ctx, s.pts); ctx.stroke();
    const ox = (rng() - .5) * r * .5, oy = (rng() - .5) * r * .5;
    const q = s.pts.map((v, i) => v + (i % 2 ? oy : ox));
    ctx.globalAlpha = a * .7; ctx.strokeStyle = rgb(R * .9, G * .9, B * .94); ctx.lineWidth = w * .55;
    trace(ctx, q); ctx.stroke();
  }

  function drawDots(ctx, s, r, rng) {
    const [R, G, B] = s.c, n = 4 + (rng() * 3 | 0), x0 = s.pts[0], y0 = s.pts[1];
    ctx.globalAlpha = .92;
    for (let i = 0; i < n; i++) {
      const a = rng() * 6.2832, d = Math.sqrt(rng()) * r * .8;
      ctx.fillStyle = rgb(R + (rng() - .5) * 50, G + (rng() - .5) * 50, B + (rng() - .5) * 50);
      ctx.beginPath();
      ctx.arc(x0 + Math.cos(a) * d, y0 + Math.sin(a) * d, Math.max(.8, r * .34 * (.75 + rng() * .5)), 0, 6.2832);
      ctx.fill();
    }
  }
  const RENDER = { oil: drawOil, water: drawWater, point: drawDots };

  function tick(J, now) {
    if (J !== job) return;
    const P = J.P;
    const frac = Math.min(1, (now - J.passStart) / J.passDur);
    const target = Math.ceil(frac * P.count);
    const render = RENDER[J.mediumKey];
    const t1 = performance.now();
    while (P.idx < target) {
      const s = strokePath(J, P, P.pts[2 * P.idx], P.pts[2 * P.idx + 1]);
      render(pctx, s, P.r, J.rng, J.pass);
      J.last = [s.pts[s.pts.length - 2], s.pts[s.pts.length - 1], P.r];
      P.idx++; J.total++;
      if ((P.idx & 31) === 0 && performance.now() - t1 > 22) break;
    }
    pctx.globalAlpha = 1;
    drawCursor(J);
    report(J);
    if (P.idx >= P.count) {
      if (!nextPass(J)) { finish(J); return; }
    }
    requestAnimationFrame(t => tick(J, t));
  }

  function drawCursor(J) {
    cctx.clearRect(0, 0, W, H);
    if (!J || !J.last || !J.P) return;
    const [x, y, r] = J.last, k = W / (paint.clientWidth || W);
    cctx.lineWidth = 2 * k; cctx.strokeStyle = 'rgba(15,18,22,.5)';
    cctx.beginPath(); cctx.arc(x, y, r + 1.5 * k, 0, 6.2832); cctx.stroke();
    cctx.lineWidth = 1.4 * k; cctx.strokeStyle = 'rgba(255,255,255,.9)';
    cctx.beginPath(); cctx.arc(x, y, r, 0, 6.2832); cctx.stroke();
  }

  function report(J) {
    const w = J.plan.w;
    let done = 0;
    for (let i = 0; i < J.pass; i++) done += w[i];
    const P = J.P;
    const prog = P ? done + w[J.pass] * (P.idx / Math.max(1, P.count)) : 1;
    barEl.style.width = (prog * 100).toFixed(1) + '%';
    if (P) setStatus(`<strong>Pass ${J.pass + 1} of ${J.radii.length}</strong> · ${brushName(P.r)} · ${J.total.toLocaleString()} strokes`, true);
  }
  function finish(J) {
    cctx.clearRect(0, 0, W, H);
    barEl.style.width = '100%';
    const secs = ((performance.now() - J.t0) / 1000).toFixed(1);
    setStatus(`<strong>Finished in ${secs} s</strong> · ${J.total.toLocaleString()} strokes over ${J.radii.length} passes · Repaint for a different take`, true);
  }
  function setStatus(msg, html) { if (html) statusEl.innerHTML = msg; else statusEl.textContent = msg; }

  function writeCaption() {
    const m = MEDIA[medium()];
    caption.innerHTML = '';
    const b = document.createElement('b'); b.textContent = `Study after ${sourceName}`;
    caption.append(b, `${m.label} · ${W} × ${H} px`);
  }

  // ---------- layout ----------
  function fit() {
    if (!W) return;
    const aw = stage.getBoundingClientRect().width;
    const ah = Math.max(220, Math.min(window.innerHeight * .66, 860));
    const s = Math.min(aw / W, ah / H, 1);
    paint.style.width = Math.floor(W * s) + 'px';
    paint.style.height = Math.floor(H * s) + 'px';
  }
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);

  // ---------- input ----------
  function openFile(f) {
    if (!f) return;
    if (f.type && !f.type.startsWith('image/')) { setStatus('That file is not an image. Choose a JPG, PNG, WebP or GIF.'); return; }
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { loadSource(img, f.name || 'a pasted photo'); URL.revokeObjectURL(url); };
    img.onerror = () => { setStatus('This browser could not read that image. Try a JPG or PNG.'); URL.revokeObjectURL(url); };
    img.src = url;
  }
  $('#open').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
  $('#again').addEventListener('click', start);
  document.querySelectorAll('input[name=medium]').forEach(el => el.addEventListener('change', start));
  $('#detail').addEventListener('change', start);
  $('#dur').addEventListener('input', e => { $('#durOut').textContent = e.target.value + ' s'; });
  $('#dur').addEventListener('change', start);

  const cmp = $('#compare');
  const showOrig = on => { orig.hidden = !on; cursor.hidden = on; cmp.classList.toggle('on', on); };
  cmp.addEventListener('pointerdown', e => { e.preventDefault(); showOrig(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => cmp.addEventListener(t, () => showOrig(false)));
  cmp.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); showOrig(true); } });
  cmp.addEventListener('keyup', () => showOrig(false));
  cmp.addEventListener('contextmenu', e => e.preventDefault());

  const drop = $('#drop');
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; drop.hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; drop.hidden = true;
    const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
    if (f) openFile(f); else setStatus('Drop an image file (JPG, PNG, WebP or GIF).');
  });
  window.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); openFile(item.getAsFile()); }
  });

  // ---------- download ----------
  const saveBtn = $('#save');
  let downloads = null;
  function exportBlob() {
    const m = MEDIA[medium()];
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.drawImage(paint, 0, 0);
    // bake in the same canvas/paper texture you see on screen, at the same visual scale
    const k = W / (paint.clientWidth || W);
    const pat = x.createPattern(TEX[m.tex], 'repeat');
    if (pat && pat.setTransform) pat.setTransform(new DOMMatrix().scale(k));
    x.globalCompositeOperation = 'multiply'; x.globalAlpha = m.texOp;
    x.fillStyle = pat; x.fillRect(0, 0, W, H);
    return new Promise(res => c.toBlob(res, 'image/png'));
  }
  function fileBase() {
    const base = sourceName.startsWith('a ') ? 'lakeside-sample' : sourceName.replace(/\.[^.]+$/, '');
    return (base.replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '') || 'photo').slice(0, 80);
  }
  saveBtn.addEventListener('click', async () => {
    if (!downloads || !W) return;
    saveBtn.disabled = true;
    try {
      const blob = await exportBlob();
      const name = `${fileBase()}-${medium() === 'water' ? 'watercolor' : medium() === 'point' ? 'pointillist' : 'oil'}-study.png`;
      await downloads.save({ filename: name, data: blob });
      setStatus(`Saved ${name}`);
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') setStatus('Download cancelled.');
      else if (code === 'rate_limited') setStatus('A save prompt is already open. Finish that one, then try again.');
      else if (code === 'too_large') setStatus('That image is too large to save here.');
      else { setStatus('Downloads are not available in this view.'); saveBtn.hidden = true; }
    } finally { saveBtn.disabled = false; }
  });
  (async () => {
    try { downloads = await window.claude?.use?.('downloads'); } catch { downloads = null; }
    if (downloads) saveBtn.hidden = false;
  })();

  // ---------- sample scene ----------
  function makeSample() {
    const c = document.createElement('canvas'), Wd = 1000, Ht = 667, hz = Ht * .56;
    c.width = Wd; c.height = Ht;
    const x = c.getContext('2d'), R = mulberry32(7);
    let g = x.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#1b2a57'); g.addColorStop(.42, '#5a4a90'); g.addColorStop(.74, '#df7a4e'); g.addColorStop(1, '#ffd27c');
    x.fillStyle = g; x.fillRect(0, 0, Wd, hz);
    const sx = Wd * .66, sy = hz - 40;
    g = x.createRadialGradient(sx, sy, 0, sx, sy, 280);
    g.addColorStop(0, 'rgba(255,242,195,.95)'); g.addColorStop(.22, 'rgba(255,192,112,.5)'); g.addColorStop(1, 'rgba(255,150,90,0)');
    x.fillStyle = g; x.fillRect(0, 0, Wd, hz);
    for (let i = 0; i < 16; i++) {
      const cy = 50 + R() * 200, cx = R() * Wd, rw = 80 + R() * 200, rh = 7 + R() * 14;
      x.fillStyle = `rgba(245,${150 + R() * 70 | 0},${150 + R() * 50 | 0},${.22 + R() * .3})`;
      x.beginPath(); x.ellipse(cx, cy, rw, rh, 0, 0, 6.2832); x.fill();
    }
    x.fillStyle = '#fff4d2'; x.beginPath(); x.arc(sx, sy, 34, 0, 6.2832); x.fill();
    const ridge = (base, amp, col, o) => {
      x.fillStyle = col; x.beginPath(); x.moveTo(0, hz);
      for (let px = 0; px <= Wd; px += 8) {
        const y = base - amp * (.5 + .5 * Math.sin(px / 170 + o)) - amp * .4 * Math.sin(px / 53 + o * 2) - (R() - .5) * 6;
        x.lineTo(px, y);
      }
      x.lineTo(Wd, hz); x.closePath(); x.fill();
    };
    ridge(hz - 60, 90, '#7a6599', 1); ridge(hz - 28, 60, '#4b3f70', 3); ridge(hz - 4, 34, '#2a2747', 5);
    x.save(); x.translate(0, hz * 2); x.scale(1, -1); x.globalAlpha = .8;
    x.drawImage(c, 0, 0, Wd, hz, 0, 0, Wd, hz); x.restore();
    g = x.createLinearGradient(0, hz, 0, Ht);
    g.addColorStop(0, 'rgba(20,20,52,.12)'); g.addColorStop(1, 'rgba(10,12,36,.72)');
    x.fillStyle = g; x.fillRect(0, hz, Wd, Ht - hz);
    for (let i = 0; i < 140; i++) {
      const yy = hz + R() * (Ht - hz);
      x.fillStyle = `rgba(255,255,255,${R() * .09})`; x.fillRect(R() * Wd, yy, 30 + R() * 140, 1.5);
    }
    for (let i = 0; i < 80; i++) {
      const yy = hz + 4 + Math.pow(R(), 1.3) * (Ht - hz - 10), spread = 18 + (yy - hz) * .5;
      const xx = sx + (R() - .5) * spread * 2, len = 10 + R() * 44;
      x.fillStyle = `rgba(255,${210 + R() * 40 | 0},150,${.35 + R() * .5})`;
      x.fillRect(xx - len / 2, yy, len, 1.5 + R() * 2.5);
    }
    x.fillStyle = '#141320'; x.beginPath(); x.moveTo(0, Ht); x.lineTo(0, Ht * .77);
    x.quadraticCurveTo(Wd * .2, Ht * .73, Wd * .38, Ht * .87); x.lineTo(Wd * .45, Ht); x.closePath(); x.fill();
    for (let i = 0; i < 9; i++) {
      const px = 14 + i * 36 + R() * 14, base = Ht * .79 + i * 5, th = 90 + R() * 130, tw = 26 + R() * 14;
      x.fillStyle = '#0f0f19';
      for (let t = 0; t < 5; t++) {
        const ty = base - th * (t / 5), wv = tw * (1 - t / 6);
        x.beginPath(); x.moveTo(px - wv, ty); x.lineTo(px + wv, ty); x.lineTo(px, ty - th * .32); x.closePath(); x.fill();
      }
      x.fillRect(px - 2, base - 4, 4, 14);
    }
    const bx = Wd * .5, by = hz + 82;
    x.fillStyle = '#17162b';
    x.beginPath(); x.moveTo(bx - 34, by); x.lineTo(bx + 34, by); x.lineTo(bx + 24, by + 9); x.lineTo(bx - 26, by + 9); x.closePath(); x.fill();
    x.fillRect(bx - 1, by - 46, 2, 46);
    x.beginPath(); x.moveTo(bx + 2, by - 44); x.lineTo(bx + 26, by - 3); x.lineTo(bx + 2, by - 3); x.closePath(); x.fill();
    return c;
  }

  loadSource(makeSample(), 'a lakeside sample');
})();
</script>

</body></html>
