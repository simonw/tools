<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>.blend URL Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .55rem;
      padding: max(.65rem, env(safe-area-inset-top)) .7rem .65rem;
      background: rgba(20,20,20,.96);
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    #url {
      width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      color: #fff;
      background: #222;
      border: 1px solid #444;
      border-radius: .55rem;
      padding: .7rem .75rem;
      outline: none;
    }
    #url:focus { border-color: #888; }
    button {
      font: inherit;
      color: #fff;
      background: #333;
      border: 1px solid #555;
      border-radius: .55rem;
      padding: .65rem .85rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: #3d3d3d; }
    button:disabled { opacity: .5; cursor: default; }
    #view { position: relative; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute;
      left: max(.65rem, env(safe-area-inset-left));
      right: max(.65rem, env(safe-area-inset-right));
      bottom: max(.65rem, env(safe-area-inset-bottom));
      display: flex;
      gap: .45rem;
      align-items: end;
      pointer-events: none;
    }
    #status {
      max-width: min(42rem, calc(100vw - 1.3rem));
      background: rgba(15,15,15,.82);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: .65rem;
      padding: .55rem .7rem;
      backdrop-filter: blur(10px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .82rem;
      line-height: 1.35;
      pointer-events: auto;
    }
    #toolbar {
      position: absolute;
      top: .65rem;
      right: max(.65rem, env(safe-area-inset-right));
      display: flex;
      gap: .4rem;
      z-index: 4;
    }
    #toolbar button {
      background: rgba(30,30,30,.84);
      backdrop-filter: blur(8px);
      padding: .5rem .65rem;
      font-size: .86rem;
    }
    #empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      color: #aaa;
      pointer-events: none;
    }
    #empty strong { display: block; color: #ddd; margin-bottom: .35rem; }
    @media (max-width: 620px) {
      header { grid-template-columns: 1fr auto; }
      #status { font-size: .76rem; }
      #toolbar { top: .5rem; right: .5rem; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <input id="url" type="url" inputmode="url" autocapitalize="none" autocomplete="off"
      spellcheck="false" placeholder="https://example.com/model.blend or GitHub /blob/ URL">
    <button id="load">View</button>
  </header>

  <main id="view">
    <div id="empty">
      <div>
        <strong>Paste a CORS-accessible .blend URL above</strong>
        Blender 5.x files are the best-supported target.
      </div>
    </div>
    <div id="toolbar">
      <button id="lights" title="Switch between the file's own lights and studio lighting" aria-pressed="true" hidden>Scene lights</button>
      <button id="fit" title="Fit model in view">Fit</button>
      <button id="wire" title="Toggle wireframe">Wireframe</button>
      <button id="reset" title="Reset viewer">Clear</button>
    </div>
    <div id="hud"><div id="status">Ready.</div></div>
  </main>

<script type="module">
import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { NURBSCurve } from "three/addons/curves/NURBSCurve.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import {
  parseBlend,
  extractMeshes,
  extractObjects,
  extractMaterials,
  extractCameras,
  extractScenes,
  extractLights,
  readMaterialShaderGraph,
  readAttributeAsUint8
} from "https://esm.sh/jsblender@0.0.4?bundle";

const $ = (s) => document.querySelector(s);
const urlInput = $("#url");
const loadButton = $("#load");
const lightsButton = $("#lights");
const status = $("#status");
const empty = $("#empty");
const view = $("#view");

const scene = new THREE.Scene();
const studioBackground = new THREE.Color(0x181818);
scene.background = studioBackground;

let camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100000);
camera.up.set(0, 0, 1);
camera.position.set(4, -6, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
RectAreaLightUniformsLib.init();

// Scenes render into a linear HDR target, then a final pass applies the view
// transform. Blender's AgX looks are grades in AgX's log space, which
// Three.js's built-in tone mapping can't express.
const hdrTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const VIEW_TRANSFORMS = { "Standard": 0, "Raw": 0, "AgX": 1, "Filmic": 1, "Khronos PBR Neutral": 2 };
// [contrast, saturation, power], from Blender's OCIO config.
const AGX_LOOKS = {
  "AgX - Very High Contrast": [1.57, 0.9, 1],
  "AgX - High Contrast": [1.4, 0.95, 1],
  "AgX - Medium High Contrast": [1.2, 1, 1],
  "AgX - Medium Low Contrast": [0.9, 1.05, 1],
  "AgX - Low Contrast": [0.8, 1.1, 1],
  "AgX - Very Low Contrast": [0.7, 1.15, 1],
  "AgX - Punchy": [1, 1.4, 1.0912],
  "AgX - Greyscale": [1, 0, 1]
};
const viewTransform = new THREE.ShaderMaterial({
  uniforms: {
    image: { value: hdrTarget.texture },
    exposure: { value: 1 },
    transform: { value: 1 },
    look: { value: new THREE.Vector3(1, 1, 1) }
  },
  vertexShader: "varying vec2 vUv;\nvoid main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `
    uniform sampler2D image;
    uniform float exposure;
    uniform int transform;
    uniform vec3 look;
    varying vec2 vUv;
    const mat3 REC2020_TO_SRGB = mat3(vec3(1.6605, -0.1246, -0.0182), vec3(-0.5876, 1.1329, -0.1006), vec3(-0.0728, -0.0083, 1.1187));
    const mat3 SRGB_TO_REC2020 = mat3(vec3(0.6274, 0.0691, 0.0164), vec3(0.3293, 0.9195, 0.0880), vec3(0.0433, 0.0113, 0.8956));
    const mat3 AGX_INSET = mat3(
      vec3(0.856627153315983, 0.137318972929847, 0.11189821299995),
      vec3(0.0951212405381588, 0.761241990602591, 0.0767994186031903),
      vec3(0.0482516061458583, 0.101439036467562, 0.811302368396859));
    const mat3 AGX_OUTSET = mat3(
      vec3(1.1271005818144368, -0.1413297634984383, -0.14132976349843826),
      vec3(-0.11060664309660323, 1.157823702216272, -0.11060664309660294),
      vec3(-0.016493938717834573, -0.016493938717834257, 1.2519364065950405));
    // Three.js's AgX (after Blender's), with the look applied to the log encoding.
    vec3 agx(vec3 color) {
      color = AGX_INSET * (SRGB_TO_REC2020 * color);
      color = clamp((log2(max(color, 1e-10)) + 12.47393) / 16.499999, 0.0, 1.0);
      color = pow(color, vec3(look.z));
      color = (color - 0.4) * look.x + 0.4;
      color = clamp(mix(vec3(dot(color, vec3(0.2126, 0.7152, 0.0722))), color, look.y), 0.0, 1.0);
      vec3 x2 = color * color, x4 = x2 * x2;
      color = 15.5 * x4 * x2 - 40.14 * x4 * color + 31.96 * x4 - 6.868 * x2 * color + 0.4298 * x2 + 0.1191 * color - 0.00232;
      color = pow(max(AGX_OUTSET * color, 0.0), vec3(2.2));
      return REC2020_TO_SRGB * color;
    }
    vec3 neutral(vec3 color) {
      float x = min(color.r, min(color.g, color.b));
      color -= x < 0.08 ? x - 6.25 * x * x : 0.04;
      float peak = max(color.r, max(color.g, color.b));
      if (peak < 0.76) return color;
      float newPeak = 1.0 - 0.0576 / (peak - 0.52);
      color *= newPeak / peak;
      return mix(color, vec3(newPeak), 1.0 - 1.0 / (0.15 * (peak - newPeak) + 1.0));
    }
    void main() {
      vec3 color = texture2D(image, vUv).rgb * exposure;
      color = clamp(transform == 1 ? agx(color) : transform == 2 ? neutral(color) : color, 0.0, 1.0);
      gl_FragColor = vec4(mix(color * 12.92, 1.055 * pow(color, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, color)), 1.0);
    }`,
  depthTest: false,
  depthWrite: false
});
const viewQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), viewTransform);
viewQuad.frustumCulled = false;
const viewCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const pmrem = new THREE.PMREMGenerator(renderer);
const studio = new RoomEnvironment();
const studioEnvironment = pmrem.fromScene(studio).texture;
scene.environment = studioEnvironment;
scene.environmentIntensity = 0.6;
studio.dispose();
view.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;

// The viewer's own lighting, used when a file has no lights of its own.
const studioLights = new THREE.Group();
studioLights.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, -5, 8);
studioLights.add(key);
scene.add(studioLights);

// Lights, world and view transform saved in the .blend file.
const fileLights = new THREE.Group();
scene.add(fileLights);
let fileLook = null;
let useFileLighting = true;

const grid = new THREE.GridHelper(20, 20, 0x666666, 0x333333);
grid.rotation.x = Math.PI / 2; // XY plane, because Blender uses Z-up
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

const modelRoot = new THREE.Group();
scene.add(modelRoot);

let wireframe = false;
let loading = false;

function applyLighting() {
  const file = Boolean(useFileLighting && fileLook);
  studioLights.visible = !file;
  fileLights.visible = file;
  grid.visible = !file;
  scene.background = file ? fileLook.background : studioBackground;
  scene.environment = file ? fileLook.environment : studioEnvironment;
  scene.environmentIntensity = file ? fileLook.environmentIntensity : 0.6;
  viewTransform.uniforms.transform.value = file ? fileLook.transform : 1;
  viewTransform.uniforms.look.value.fromArray(file ? fileLook.look : [1, 1, 1]);
  viewTransform.uniforms.exposure.value = file ? fileLook.exposure : 1;
  lightsButton.hidden = !fileLook;
  lightsButton.textContent = file ? "Scene lights" : "Studio lights";
  lightsButton.setAttribute("aria-pressed", String(file));
}

function setStatus(text) {
  status.textContent = text;
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
}

function normalizeURL(input) {
  const u = new URL(input.trim());

  // Normal GitHub file page:
  // https://github.com/owner/repo/blob/ref/path/file.blend
  if (u.hostname === "github.com") {
    const parts = u.pathname.split("/").filter(Boolean);
    const blobIndex = parts.indexOf("blob");
    if (blobIndex === 2 && parts.length >= 5) {
      const owner = parts[0];
      const repo = parts[1];
      const ref = parts[3];
      const path = parts.slice(4).join("/");
      // jsDelivr is usually convenient and CORS-friendly for public repositories.
      return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${path}`;
    }
  }
  return u.href;
}

function clearModel() {
  while (modelRoot.children.length) {
    const obj = modelRoot.children.pop();
    obj.traverse?.((child) => {
      child.geometry?.dispose?.();
      if (Array.isArray(child.material)) child.material.forEach(m => m.dispose?.());
      else child.material?.dispose?.();
    });
  }
  fileLights.clear();
  fileLook?.environmentTarget?.dispose();
  fileLook = null;
  applyLighting();
  empty.style.display = "";
  setStatus("Ready.");
}

// jsblender exposes node sockets but not node settings (math operation, blend
// mode, ramp stops...). Read those from the file's SDNA and attach them.
function readNodeSettings(blend, materials) {
  const r = blend.reader;
  const layout = type => blend.sdna.structIndexByType.has(type) ? r.layoutOf(type) : null;
  const offset = (type, base, name) => base + r.layoutOf(type).fieldByName.get(name).offset;
  const scalar = (type, base, name) => {
    const f = layout(type)?.fieldByName.get(name);
    return f ? Number(r.readPrimitive(f.typeName, base + f.offset)) : 0;
  };
  const storageFields = {
    ShaderNodeMapRange: ["NodeMapRange", "data_type", "interpolation_type", "clamp"],
    ShaderNodeMix: ["NodeShaderMix", "data_type", "factor_mode", "clamp_factor", "clamp_result", "blend_type"],
    ShaderNodeTexNoise: ["NodeTexNoise", "dimensions", "type", "normalize"],
    ShaderNodeTexWave: ["NodeTexWave", "wave_type", "bands_direction", "rings_direction", "wave_profile"],
    ShaderNodeTexVoronoi: ["NodeTexVoronoi", "dimensions", "feature", "distance"],
    ShaderNodeTexGradient: ["NodeTexGradient", "gradient_type"],
    ShaderNodeSeparateColor: ["NodeCombSepColor", "mode"],
    ShaderNodeCombineColor: ["NodeCombSepColor", "mode"]
  };
  const materialByName = new Map(materials.map(m => [m.name, m]));
  for (const block of blend.blocks.filter(b => b.code === "MA")) {
    const mat = materialByName.get(r.readCString(offset("ID", block.dataOffset, "name"), 258).slice(2));
    if (!mat?.shader) continue;
    const tree = r.followPointer(offset("Material", block.dataOffset, "nodetree"), block.dataOffset);
    if (!tree) continue;
    const parsedByName = new Map(mat.shader.nodes.map(n => [n.name, n]));
    let node = r.followPointer(offset("bNodeTree", tree.dataOffset, "nodes"), tree.dataOffset);
    const seen = new Set();
    while (node && !seen.has(node.dataOffset)) {
      seen.add(node.dataOffset);
      const o = node.dataOffset;
      const parsed = parsedByName.get(r.readCString(offset("bNode", o, "name"), 64));
      const storage = r.followPointer(offset("bNode", o, "storage"), tree.dataOffset);
      if (parsed) {
        parsed.flag = scalar("bNode", o, "flag");
        parsed.custom1 = scalar("bNode", o, "custom1");
        parsed.custom2 = scalar("bNode", o, "custom2");
        const spec = storageFields[parsed.idname];
        if (storage && spec && layout(spec[0])) {
          parsed.settings = Object.fromEntries(spec.slice(1).map(k => [k, scalar(spec[0], storage.dataOffset, k)]));
        }
        if (storage && parsed.idname === "ShaderNodeValToRGB") {
          parsed.interpolation = scalar("ColorBand", storage.dataOffset, "ipotype");
          const count = Math.min(32, scalar("ColorBand", storage.dataOffset, "tot"));
          parsed.ramp = Array.from({ length: count }, (_, i) => {
            const c = offset("ColorBand", storage.dataOffset, "data") + i * r.layoutOf("CBData").size;
            return { position: scalar("CBData", c, "pos"), color: ["r", "g", "b"].map(k => scalar("CBData", c, k)), alpha: scalar("CBData", c, "a") };
          }).sort((a, b) => a.position - b.position);
        }
      }
      node = r.followPointer(offset("bNode", o, "next"), tree.dataOffset);
    }
  }
}

// The scene's world background and view transform.
function readRenderSettings(blend) {
  const r = blend.reader;
  const field = (type, name) => blend.sdna.structIndexByType.has(type) ? r.layoutOf(type).fieldByName.get(name) : undefined;
  const settings = { viewTransform: "AgX", look: "", exposure: 0, world: null };
  const sceneBlock = blend.blocks.find(b => b.code === "SC");
  if (!sceneBlock) return settings;
  const base = sceneBlock.dataOffset;
  const viewSettings = field("Scene", "view_settings");
  if (viewSettings) {
    const at = name => base + viewSettings.offset + field("ColorManagedViewSettings", name).offset;
    settings.viewTransform = r.readCString(at("view_transform"), 64);
    settings.look = r.readCString(at("look"), 64);
    settings.exposure = r.readFloat32(at("exposure"));
  }
  const worldField = field("Scene", "world");
  const world = worldField && r.followPointer(base + worldField.offset, base);
  if (!world) return settings;
  const w = world.dataOffset;
  settings.world = { color: ["horr", "horg", "horb"].map(n => r.readFloat32(w + field("World", n).offset)), strength: 1, textured: false };
  // readMaterialShaderGraph only knows Material's layout: shift the base so its
  // nodetree read lands on World.nodetree instead.
  const worldTree = field("World", "nodetree"), materialTree = field("Material", "nodetree");
  const nodes = worldTree && materialTree
    ? readMaterialShaderGraph(blend, w + worldTree.offset - materialTree.offset)?.nodes || [] : [];
  const output = nodes.find(n => n.idname === "ShaderNodeOutputWorld");
  const link = output?.inputs.find(s => s.name === "Surface")?.linkedFrom;
  const background = link && nodes.find(n => n.name === link.nodeName);
  if (background?.idname === "ShaderNodeBackground") {
    const color = background.inputs.find(s => s.name === "Color");
    const strength = background.inputs.find(s => s.name === "Strength");
    if (typeof strength?.defaultValue === "number" && !strength.linkedFrom) settings.world.strength = strength.defaultValue;
    if (color?.linkedFrom) settings.world.textured = true;
    else if (color?.defaultValue) settings.world.color = Array.from(color.defaultValue).slice(0, 3);
  } else if (link) {
    settings.world.textured = true;
  }
  return settings;
}

// jsblender reads Lamp.energy, which Blender 4+ keeps only as a deprecated
// copy; the current power is stored in energy_new.
function readLightEnergies(blend) {
  const r = blend.reader, energies = new Map();
  if (!blend.sdna.structIndexByType.has("Lamp")) return energies;
  const fields = r.layoutOf("Lamp").fieldByName;
  const energy = fields.get("energy_new") ?? fields.get("energy");
  const exposure = fields.get("exposure");
  const name = r.layoutOf("ID").fieldByName.get("name");
  for (const block of blend.blocks.filter(b => b.code === "LA")) {
    const o = block.dataOffset;
    energies.set(r.readCString(o + name.offset, name.size).slice(2),
      r.readFloat32(o + energy.offset) * 2 ** (exposure ? r.readFloat32(o + exposure.offset) : 0));
  }
  return energies;
}

// Blender light units to Three.js: point and spot watts spread over 4π
// steradians, area lights as radiance, suns as irradiance.
function addFileLight(data, energy, worldMatrix) {
  const position = new THREE.Vector3(), rotation = new THREE.Quaternion(), scale = new THREE.Vector3();
  new THREE.Matrix4().fromArray(worldMatrix).decompose(position, rotation, scale);
  const color = new THREE.Color(...data.color);
  let light;
  if (data.type === "sun") {
    light = new THREE.DirectionalLight(color, energy);
  } else if (data.type === "spot") {
    light = new THREE.SpotLight(color, energy / (4 * Math.PI), 0, Math.min(data.spotSize ?? Math.PI / 4, Math.PI) / 2, data.spotBlend ?? 0.15, 2);
  } else if (data.type === "area") {
    const [sizeX, sizeY = sizeX] = data.areaSize ?? [1];
    const round = data.areaShape === "disk" || data.areaShape === "ellipse";
    const width = sizeX * scale.x;
    const height = (data.areaShape === "rectangle" || data.areaShape === "ellipse" ? sizeY : sizeX) * scale.y;
    const area = Math.max(round ? Math.PI * width * height / 4 : width * height, 1e-8);
    // RectAreaLight is rectangular: give disks and ellipses the same emitting area.
    const k = round ? Math.sqrt(Math.PI) / 2 : 1;
    light = new THREE.RectAreaLight(color, energy / (Math.PI * area), width * k, height * k);
  } else {
    light = new THREE.PointLight(color, energy / (4 * Math.PI), 0, 2);
  }
  // Blender lights shine down their local -Z axis, as Three.js lights do.
  light.name = data.name;
  light.position.copy(position);
  light.quaternion.copy(rotation);
  if (light.target) {
    light.target.position.copy(position).add(new THREE.Vector3(0, 0, -1).applyQuaternion(rotation));
    fileLights.add(light.target);
  }
  fileLights.add(light);
}

function makeFileLook(settings) {
  const world = settings.world;
  const color = new THREE.Color(...(world?.color ?? [0, 0, 0])).multiplyScalar(world?.strength ?? 1);
  const transform = VIEW_TRANSFORMS[settings.viewTransform] ?? 1;
  const look = {
    background: color,
    environment: null,
    environmentIntensity: 1,
    transform,
    look: transform === 1 ? AGX_LOOKS[settings.look] ?? [1, 1, 1] : [1, 1, 1],
    exposure: 2 ** settings.exposure
  };
  if (world?.textured) {
    // Image and sky worlds aren't evaluated: approximate them with the studio environment.
    Object.assign(look, { background: studioBackground, environment: studioEnvironment, environmentIntensity: 0.6 * world.strength });
  } else {
    look.captureSurroundings = true;
  }
  return look;
}

// Reflections of the file's surroundings (backdrops, floors, the world):
// render the lit scene from the model's centre, with the near plane clipping
// away the model itself.
function captureSurroundings() {
  const box = modelBounds();
  if (!fileLook?.captureSurroundings || box.isEmpty()) return;
  const { center, radius } = box.getBoundingSphere(new THREE.Sphere());
  const wasUsingFile = useFileLighting;
  useFileLighting = true;
  applyLighting();
  // PMREM's own background box sits at the origin, so supply one around the probe.
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 500, 32, 16),
    new THREE.MeshBasicMaterial({ color: fileLook.background, side: THREE.BackSide, depthWrite: false })
  );
  sky.position.copy(center);
  sky.renderOrder = -Infinity;
  scene.add(sky);
  scene.background = null;
  const target = pmrem.fromScene(scene, 0, radius, radius * 1000, { position: center });
  scene.remove(sky);
  sky.geometry.dispose();
  sky.material.dispose();
  fileLook.environmentTarget?.dispose();
  Object.assign(fileLook, { environment: target.texture, environmentTarget: target });

    case "ShaderNodeRGB":
      return c.constant(node.outputs[0]?.defaultValue, node.idname === "ShaderNodeRGB");
    case "ShaderNodeSeparateXYZ": {
      const v = V("Vector");
      return v && ["X", "Y", "Z"].includes(out) ? c.float(`(${v}).${out.toLowerCase()}`) : null;
    }
    case "ShaderNodeCombineXYZ": {
      const xs = ["X", "Y", "Z"].map(F);
      return all(...xs) ? c.vector(`vec3(${xs.join(", ")})`) : null;
    }
    case "ShaderNodeSeparateColor":
    case "ShaderNodeSeparateRGB": {
      const channel = { Red: "r", R: "r", Green: "g", G: "g", Blue: "b", B: "b" }[out];
      const v = V(node.idname === "ShaderNodeSeparateRGB" ? "Image" : "Color");
      return v && channel && !settings.mode ? c.float(`(${v}).${channel}`) : null;
    }
    case "ShaderNodeCombineColor":
    case "ShaderNodeCombineRGB": {
      const xs = (node.idname === "ShaderNodeCombineRGB" ? ["R", "G", "B"] : ["Red", "Green", "Blue"]).map(F);
      return all(...xs) && !settings.mode ? c.vector(`vec3(${xs.join(", ")})`, true) : null;
    }
    case "ShaderNodeRGBToBW": {
      const v = V("Color");
      return v && c.float(`dot(${v}, vec3(0.2126, 0.7152, 0.0722))`);
    }
    case "ShaderNodeInvert": {
      const f = F("Fac"), v = V("Color");
      return all(f, v) ? c.vector(c.declare("vec3", `mix(${v}, vec3(1.0) - ${v}, ${f})`), true) : null;
    }
    case "ShaderNodeGamma": {
      const v = V("Color"), g = F("Gamma");
      return all(v, g) ? c.vector(c.declare("vec3", `pow(max(${v}, vec3(0.0)), vec3(${g}))`), true) : null;
    }
    case "ShaderNodeBrightContrast": {
      const v = V("Color"), b = F("Bright"), k = F("Contrast");
      return all(v, b, k) ? c.vector(c.declare("vec3", `max((1.0 + ${k}) * ${v} + (${b} - ${k} * 0.5), vec3(0.0))`), true) : null;
    }
    case "ShaderNodeClamp": {
      const x = F("Value"), lo = F("Min"), hi = F("Max");
      if (!all(x, lo, hi)) return null;
      return c.float(c.declare("float", node.custom1 === 1 ? `clamp(${x}, min(${lo}, ${hi}), max(${lo}, ${hi}))` : `min(max(${x}, ${lo}), ${hi})`));
    }
    case "ShaderNodeMath": {
      const xs = ["Value", "Value_001", "Value_002"].map(F);
      if (!all(...xs)) return null;
      const expr = `bMath(${node.custom1 ?? 0}, ${xs.join(", ")})`;
      return c.float(c.declare("float", node.custom2 & 1 ? `clamp(${expr}, 0.0, 1.0)` : expr));
    }
    case "ShaderNodeVectorMath": {
      const xs = ["Vector", "Vector_001", "Vector_002"].map(V), s = F("Scale");
      if (!all(...xs, s)) return null;
      const r = c.declare("vec4", `bVectorMath(${node.custom1 ?? 0}, ${xs.join(", ")}, ${s})`);
      return out === "Value" ? c.float(`${r}.w`) : c.vector(`${r}.xyz`);
    }
    case "ShaderNodeMapRange": {
      if ((settings.data_type ?? 10) !== 10) return null; // CD_PROP_FLOAT; vector ranges unsupported
      const xs = ["Value", "From Min", "From Max", "To Min", "To Max", "Steps"].map(F);
      if (!all(...xs)) return null;
      return c.float(c.declare("float", `bMapRange(${xs.join(", ")}, ${settings.interpolation_type ?? 0}, ${settings.clamp ? "true" : "false"})`));
    }
    case "ShaderNodeMapping": {
      const v = V("Vector"), location = V("Location"), scale = V("Scale"), rotation = c.socketOf(node, "Rotation");
      if (!all(v, location, scale) || rotation?.linkedFrom) return null;
      const [x = 0, y = 0, z = 0] = rotation?.defaultValue ?? [];
      // Blender's XYZ Euler is Rz·Ry·Rx, which Three.js calls "ZYX".
      const m = new THREE.Matrix3().setFromMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(x, y, z, "ZYX")));
      const R = `mat3(${m.elements.map(glslNumber).join(", ")})`;
      const type = node.custom1 ?? 0;
      const expr = type === 1 ? `bSafeDivide(transpose(${R}) * (${v} - ${location}), ${scale})`
        : type === 2 ? `${R} * (${v} * ${scale})`
        : type === 3 ? `normalize(${R} * bSafeDivide(${v}, ${scale}))`
        : `${R} * (${v} * ${scale}) + ${location}`;
      return c.vector(c.declare("vec3", expr));
    }
    case "ShaderNodeMix": {
      const type = settings.data_type ?? 2; // SOCK_FLOAT, SOCK_VECTOR, SOCK_RGBA
      const suffix = ["Float", "Vector", "Color"][type];
      if (!suffix) return null;
      const perComponent = type === 1 && settings.factor_mode;
      let f = perComponent ? V("Factor_Vector") : F("Factor_Float");
      const read = type === 0 ? F : V;
      const a = read(`A_${suffix}`), b = read(`B_${suffix}`);
      if (!all(f, a, b)) return null;
      if (settings.clamp_factor) f = `clamp(${f}, 0.0, 1.0)`;
      if (type === 0) return c.float(c.declare("float", `mix(${a}, ${b}, ${f})`));
      if (type === 1) return c.vector(c.declare("vec3", `mix(${a}, ${b}, ${f})`));
      const blended = `bBlend(${settings.blend_type ?? 0}, ${f}, ${a}, ${b})`;
      return c.vector(c.declare("vec3", settings.clamp_result ? `clamp(${blended}, 0.0, 1.0)` : blended), true);
    }
    case "ShaderNodeMixRGB": {
      const f = F("Fac"), a = V("Color1"), b = V("Color2");
      if (!all(f, a, b)) return null;
      const blended = `bBlend(${node.custom1 ?? 0}, clamp(${f}, 0.0, 1.0), ${a}, ${b})`;
      return c.vector(c.declare("vec3", node.custom2 & 2 ? `clamp(${blended}, 0.0, 1.0)` : blended), true);
    }
    case "ShaderNodeValToRGB": {
      const f = F("Fac");
      if (!f || !node.ramp?.length) return null;
      const t = c.declare("float", f);
      const stop = s => `vec4(${[...s.color, s.alpha ?? 1].map(glslNumber).join(", ")})`;
      let result = stop(node.ramp[0]);
      for (let i = 1; i < node.ramp.length; i++) {
        const a = node.ramp[i - 1], b = node.ramp[i];
        // COLBAND_INTERP_CONSTANT = 4, EASE = 1; B-spline and cardinal fall back to linear.
        let w = node.interpolation === 4 ? `step(${glslNumber(b.position)}, ${t})`
          : `clamp((${t} - ${glslNumber(a.position)}) / ${glslNumber(Math.max(1e-6, b.position - a.position))}, 0.0, 1.0)`;
        if (node.interpolation === 1) w = `smoothstep(0.0, 1.0, ${w})`;
        result = c.declare("vec4", `mix(${result}, ${stop(b)}, ${w})`);
      }
      return out === "Alpha" ? c.float(`(${result}).a`) : c.vector(`(${result}).rgb`, true);
    }
    case "ShaderNodeTexNoise": {
      const p = coords(), xs = ["Scale", "Detail", "Roughness", "Lacunarity", "Distortion"].map(F);
      if (!all(p, ...xs)) return null;
      const args = `${p}, ${xs.join(", ")}, ${settings.normalize === 0 ? "false" : "true"}`;
      return out === "Color" ? c.vector(c.declare("vec3", `bNoiseColor(${args})`), true) : c.float(c.declare("float", `bNoiseFac(${args})`));
    }
    case "ShaderNodeTexVoronoi": {
      const p = coords(), scale = F("Scale"), randomness = F("Randomness"), exponent = F("Exponent") ?? "1.0";
      if (!all(p, scale, randomness)) return null;
      const co = `(${p}) * ${scale}`, rand = `clamp(${randomness}, 0.0, 1.0)`;
      if (settings.feature === 3) return out === "Distance" ? c.float(c.declare("float", `bVoronoiEdge(${co}, ${rand})`)) : null;
      // F1; other features are approximated by it.
      const d = c.fresh(), color = c.fresh(), position = c.fresh();
      c.statements.push(`float ${d}; vec3 ${color}, ${position}; bVoronoiF1(${co}, ${rand}, ${settings.distance ?? 0}, ${exponent}, ${d}, ${color}, ${position});`);
      return { Distance: c.float(d), Color: c.vector(color, true), Position: c.vector(position) }[out] ?? null;
    }
    case "ShaderNodeTexWave": {
      const p = coords(), xs = ["Scale", "Distortion", "Detail", "Detail Scale", "Detail Roughness", "Phase Offset"].map(F);
      if (!all(p, ...xs)) return null;
      const [scale, ...rest] = xs;
      return colorOrFactor(c.declare("float", `bWave((${p}) * ${scale}, ${settings.wave_type ?? 0}, ${settings.bands_direction ?? 0}, ${settings.rings_direction ?? 0}, ${settings.wave_profile ?? 0}, ${rest.join(", ")})`));
    }
    case "ShaderNodeTexGradient": {
      const p = coords();
      return p && colorOrFactor(c.declare("float", `clamp(bGradient(${p}, ${settings.gradient_type ?? 0}), 0.0, 1.0)`));
    }
    case "ShaderNodeTexChecker": {
      const p = coords(), a = V("Color1"), b = V("Color2"), scale = F("Scale");
      if (!all(p, a, b, scale)) return null;
      const f = c.declare("float", `bChecker((${p}) * ${scale})`);
      return out === "Color" ? c.vector(c.declare("vec3", `mix(${b}, ${a}, ${f})`), true) : c.float(f);
    }
    case "ShaderNodeFresnel": {
      const ior = F("IOR");
      return ior && c.float(c.declare("float", `bFresnel(gl_FrontFacing ? max(${ior}, 1e-5) : 1.0 / max(${ior}, 1e-5), bShadingNormal(), bIncoming())`));
    }
    case "ShaderNodeLayerWeight": {
      const blend = F("Blend");
      if (!blend) return null;
      if (out === "Facing") return c.float(c.declare("float", `bLayerFacing(${blend}, bShadingNormal(), bIncoming())`));
      return c.float(c.declare("float", `bFresnel(gl_FrontFacing ? 1.0 / max(1.0 - ${blend}, 1e-5) : max(1.0 - ${blend}, 1e-5), bShadingNormal(), bIncoming())`));
    }
  }
  return null;
}

const CLOSURES = (() => {
  const diffuse = { kind: "bsdf", sockets: { color: "Color", normal: "Normal" }, fixed: { metallic: 0, roughness: 1, specular: 0 } };
  const glossy = { kind: "bsdf", sockets: { color: "Color", roughness: "Roughness", normal: "Normal" }, fixed: { metallic: 1 } };
  const glass = { kind: "glass", sockets: { color: "Color", roughness: "Roughness", ior: "IOR", normal: "Normal" } };
  const transparent = { kind: "transparent", sockets: { color: "Color" } };
  return {
    ShaderNodeBsdfPrincipled: { kind: "bsdf", sockets: {
      color: "Base Color", metallic: "Metallic", roughness: "Roughness", ior: "IOR", alpha: "Alpha", normal: "Normal",
      emission: "Emission Color", strength: "Emission Strength", coat: "Coat Weight", coatRoughness: "Coat Roughness",
      sheen: "Sheen Weight", sheenTint: "Sheen Tint", sheenRoughness: "Sheen Roughness", specular: "Specular IOR Level"
    } },
    ShaderNodeBsdfDiffuse: diffuse, ShaderNodeBsdfTranslucent: diffuse, ShaderNodeSubsurfaceScattering: diffuse,
    ShaderNodeBsdfSheen: diffuse, ShaderNodeBsdfToon: diffuse, ShaderNodeBsdfHair: diffuse, ShaderNodeBsdfHairPrincipled: diffuse,
    ShaderNodeBsdfGlossy: glossy, ShaderNodeBsdfAnisotropic: glossy,
    ShaderNodeBsdfMetallic: { ...glossy, sockets: { ...glossy.sockets, color: "Base Color" } },
    ShaderNodeEeveeSpecular: { kind: "bsdf", sockets: { color: "Base Color", roughness: "Roughness", normal: "Normal", emission: "Emissive Color" }, fixed: { metallic: 0 } },
    ShaderNodeBsdfGlass: glass, ShaderNodeBsdfRefraction: glass,
    ShaderNodeBsdfTransparent: transparent, ShaderNodeHoldout: transparent, ShaderNodeBsdfRayPortal: transparent,
    ShaderNodeEmission: { kind: "emission", sockets: { emission: "Color", strength: "Strength" } }
  };
})();

// Reduces a surface shader tree to the single closure a raster material can
// show, keeping transparency mixes as coverage and added emission.
function resolveClosure(node, c, depth = 0) {
  if (!node || depth > 32) return null;
  const linked = socket => socket?.linkedFrom ? c.node(socket.linkedFrom.nodeName) : null;
  if (node.idname === "NodeReroute") return resolveClosure(linked(node.inputs[0]), c, depth + 1);
  const spec = CLOSURES[node.idname];
  if (spec) {
    const constant = key => { const d = c.socketOf(node, key)?.defaultValue; return typeof d === "number" ? d : 0; };
    if (node.idname === "ShaderNodeBsdfPrincipled" && constant("Transmission Weight") >= 0.5 && constant("Metallic") < 0.5) {
      return { kind: "glass", node, sockets: { color: "Base Color", roughness: "Roughness", ior: "IOR", normal: "Normal" }, fixed: {} };
    }
    return { kind: spec.kind, node, sockets: spec.sockets, fixed: spec.fixed ?? {} };
  }
  const [a, b] = node.inputs.filter(s => s.name === "Shader").map(s => resolveClosure(linked(s), c, depth + 1));
  if (!a || !b) return a || b || null;
  if (node.idname === "ShaderNodeAddShader") {
    if (a.kind === "emission" && b.kind !== "emission") return { ...b, extraEmission: a };
    return b.kind === "emission" && a.kind !== "emission" ? { ...a, extraEmission: b } : a;
  }
  if (node.idname !== "ShaderNodeMixShader") return null;
  const fac = c.value(node, node.inputs.find(s => s.name !== "Shader"));
  const constant = c.isConstant(fac) ? Number(fac.v) : null;
  if (constant !== null && constant <= 0.001) return a;
  if (constant !== null && constant >= 0.999) return b;
  if (fac && b.kind === "transparent" && a.kind !== "transparent") return { ...a, coverage: { value: fac, invert: true } };
  if (fac && a.kind === "transparent" && b.kind !== "transparent") return { ...b, coverage: { value: fac, invert: false } };
  return (constant ?? 0.5) < 0.5 ? a : b;
}

// Volume shaders reduced to absorption and scattering coefficients per channel.
function resolveVolume(node, c, weight = 1, depth = 0) {
  if (!node || depth > 32 || weight <= 0) return null;
  const number = (key, fallback) => { const d = c.socketOf(node, key)?.defaultValue; return typeof d === "number" ? d : fallback; };
  const color = (key, fallback) => { const d = c.socketOf(node, key)?.defaultValue; return d?.length >= 3 ? [d[0], d[1], d[2]] : fallback; };
  const children = w => node.inputs.filter(s => s.name === "Shader")
    .map((s, i) => resolveVolume(s.linkedFrom && c.node(s.linkedFrom.nodeName), c, w[i], depth + 1));
  const sum = volumes => {
    const out = { absorb: [0, 0, 0], scatter: [0, 0, 0] };
    for (const v of volumes.filter(Boolean)) for (let i = 0; i < 3; i++) {
      out.absorb[i] += v.absorb[i];
      out.scatter[i] += v.scatter[i];
    }
    return volumes.some(Boolean) ? out : null;
  };
  const density = number("Density", 1) * weight;
  switch (node.idname) {
    case "ShaderNodeVolumeAbsorption":
      return { absorb: color("Color", [0.8, 0.8, 0.8]).map(x => density * Math.max(1 - x, 0)), scatter: [0, 0, 0] };
    case "ShaderNodeVolumeScatter":
      return { absorb: [0, 0, 0], scatter: color("Color", [0.8, 0.8, 0.8]).map(x => density * x) };
    case "ShaderNodeVolumePrincipled": {
      const scatter = color("Color", [0.5, 0.5, 0.5]), absorption = color("Absorption Color", [0, 0, 0]);
      return { scatter: scatter.map(x => density * x), absorb: scatter.map((x, i) => density * Math.max(1 - x, 0) * Math.max(1 - absorption[i], 0)) };
    }
    case "ShaderNodeAddShader":
      return sum(children([weight, weight]));
    case "ShaderNodeMixShader": {
      const f = Math.min(Math.max(number("Fac", 0.5), 0), 1);
      return sum(children([weight * (1 - f), weight * f]));
    }
  }
  return null;
}

// Filter blending: result = shaded color + background × tint. This gives
// glass its reflections without hiding what is behind it, and tints the view
// through volumes.
const filterBlending = tint => ({
  transparent: true,
  depthWrite: false,
  blending: THREE.CustomBlending,
  blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor,
  blendDst: THREE.ConstantColorFactor,
  blendColor: new THREE.Color(...tint),
  blendSrcAlpha: THREE.ZeroFactor,
  blendDstAlpha: THREE.OneFactor
});

const bumpGLSL = ({ height, distance, strength }) => `{
  float bumpHeight = (${height}) * ${distance};
  vec3 bumpDx = dFdx(-vViewPosition), bumpDy = dFdy(-vViewPosition);
  vec3 bumpR1 = cross(bumpDy, normal), bumpR2 = cross(normal, bumpDx);
  float bumpDet = dot(bumpDx, bumpR1);
  vec3 bumpGradient = dFdx(bumpHeight) * bumpR1 + dFdy(bumpHeight) * bumpR2;
  normal = normalize(mix(normal, normalize(abs(bumpDet) * normal - sign(bumpDet) * bumpGradient), max(${strength}, 0.0)));
}`;

function applyGraph(material, c, parts) {
  const statements = c.statements.join("\n");
  if (!statements && !Object.values(parts).some(Boolean)) return;
  const inject = [
    ["#include <color_fragment>", [statements, parts.color && `diffuseColor.rgb = ${parts.color};`, parts.alpha && `diffuseColor.a *= ${parts.alpha};`]],
    ["#include <roughnessmap_fragment>", [parts.roughness && `roughnessFactor = ${parts.roughness};`]],
    ["#include <metalnessmap_fragment>", [parts.metalness && `metalnessFactor = ${parts.metalness};`]],
    ["#include <normal_fragment_maps>", [parts.bump && bumpGLSL(parts.bump)]],
    ["#include <emissivemap_fragment>", [parts.emission && `totalEmissiveRadiance = ${parts.emission};`]]
  ];
  material.onBeforeCompile = shader => {
    shader.vertexShader = BLEND_VERTEX + shader.vertexShader.replace("#include <begin_vertex>", `#include <begin_vertex>\n${BLEND_VERTEX_MAIN}`);
    let fragment = BLEND_VARYINGS + BLENDER_GLSL + shader.fragmentShader;
    for (const [anchor, lines] of inject) {
      const snippet = lines.filter(Boolean).join("\n");
      if (snippet) fragment = fragment.replace(anchor, `${anchor}\n${snippet}`);
    }
    shader.fragmentShader = fragment;
  };
  const cacheKey = JSON.stringify([statements, parts]);
  material.customProgramCacheKey = () => cacheKey;
}

function activeOutput(nodes, idname) {
  const outputs = nodes.filter(n => n.idname === idname);
  // NODE_DO_OUTPUT marks the active output; custom1 is its target (1 = EEVEE only).
  return outputs.find(n => n.flag & 2 && n.custom1 !== 1) ?? outputs.find(n => n.custom1 !== 1) ?? outputs[0];
}

// Returns {material, uses, volume, tint, renderOrder}. Volume materials are
// completed per mesh by finishVolume(), since they depend on its thickness.
function buildMaterial(blenderMat) {
  const base = { side: THREE.DoubleSide, wireframe };
  const info = { material: null, uses: new Set(), volume: null, tint: null, renderOrder: 0 };
  if (!blenderMat) {
    info.material = new THREE.MeshStandardMaterial({ color: 0xb9bcc4, metalness: 0, roughness: 0.72, ...base });
    return info;
  }
  const nodes = blenderMat.shader?.nodes || [];
  const output = activeOutput(nodes, "ShaderNodeOutputMaterial");
  if (!output) {
    const [r, g, b, a = 1] = blenderMat.diffuse || [0.7, 0.7, 0.7, 1];
    info.material = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(r, g, b), opacity: a, transparent: a < 0.999,
      metalness: THREE.MathUtils.clamp(blenderMat.metallic ?? 0, 0, 1),
      roughness: THREE.MathUtils.clamp(blenderMat.roughness ?? 0.7, 0.02, 1), ...base
    });
    return info;
  }
  const c = createGraphCompiler(nodes);
  info.uses = c.uses;
  const linkedTo = key => { const s = c.socketOf(output, key); return s?.linkedFrom ? c.node(s.linkedFrom.nodeName) : null; };
  const surface = resolveClosure(linkedTo("Surface"), c);
  info.volume = resolveVolume(linkedTo("Volume"), c);

  // A closure parameter: a GLSL value when its socket is linked to something
  // compilable, otherwise the socket's own constant.
  const param = (closure, name, fallback) => {
    if (closure.fixed && name in closure.fixed) return { constant: closure.fixed[name] };
    const socket = closure.sockets[name] && c.socketOf(closure.node, closure.sockets[name]);
    if (!socket) return { constant: fallback };
    const expr = socket.linkedFrom ? c.value(closure.node, socket) : null;
    return { expr, constant: socket.defaultValue ?? fallback };
  };
  const scalar = p => Number.isFinite(Number(p.constant)) ? Number(p.constant) : 0;
  const rgb = p => {
    const v = p.constant;
    return v?.length >= 3 ? [v[0], v[1], v[2]] : [scalar(p), scalar(p), scalar(p)];
  };
  const floatOf = p => p.expr ? c.toFloat(p.expr) : glslNumber(scalar(p));
  const vecOf = p => p.expr ? c.toVec(p.expr) : `vec3(${rgb(p).map(glslNumber).join(", ")})`;
  const coverage = closure => {
    if (!closure?.coverage) return { constant: 1, expr: null };
    const { value, invert } = closure.coverage;
    if (c.isConstant(value)) return { constant: invert ? 1 - Number(value.v) : Number(value.v), expr: null };
    return { constant: 1, expr: invert ? `(1.0 - ${c.toFloat(value)})` : c.toFloat(value) };
  };

  if (!surface) {
    if (info.volume) {
      info.material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.FrontSide, wireframe, ...filterBlending([1, 1, 1]) });
      info.tint = [1, 1, 1];
      info.renderOrder = 1;
    } else {
      // An output with no shader renders black in Blender.
      info.material = new THREE.MeshBasicMaterial({ color: 0x000000, ...base });
    }
    return info;
  }

  if (surface.kind === "transparent" || surface.kind === "glass") {
    const tint = rgb(param(surface, "color", [1, 1, 1]));
    if (surface.kind === "transparent" && tint.every(x => x >= 0.999) && !info.volume) {
      info.material = new THREE.MeshBasicMaterial({ visible: false });
      return info;
    }
    const reflective = surface.kind === "glass";
    info.material = reflective
      ? new THREE.MeshPhysicalMaterial({
          color: 0x000000, metalness: 0, specularColor: new THREE.Color(...tint),
          roughness: THREE.MathUtils.clamp(scalar(param(surface, "roughness", 0)), 0.02, 1),
          ior: THREE.MathUtils.clamp(scalar(param(surface, "ior", 1.5)), 1, 2.333), ...base, ...filterBlending(tint)
        })
      : new THREE.MeshBasicMaterial({ color: 0x000000, ...base, ...filterBlending(tint) });
    info.tint = tint;
    info.renderOrder = 2;
    return info;
  }

  const cover = coverage(surface);
  if (surface.kind === "emission") {
    const color = param(surface, "emission", [1, 1, 1]), strength = param(surface, "strength", 1);
    info.material = new THREE.MeshBasicMaterial({
      color: new THREE.Color(...rgb(color)).multiplyScalar(scalar(strength)),
      opacity: cover.constant, transparent: cover.constant < 0.999, alphaHash: Boolean(cover.expr), ...base
    });
    applyGraph(info.material, c, {
      color: (color.expr || strength.expr) && `${vecOf(color)} * ${floatOf(strength)}`,
      alpha: cover.expr
    });
    return info;
  }

  const color = param(surface, "color", [0.8, 0.8, 0.8]);
  const metallic = param(surface, "metallic", 0);
  const roughness = param(surface, "roughness", 0.5);
  const alpha = param(surface, "alpha", 1);
  const opacity = (alpha.expr ? 1 : scalar(alpha)) * cover.constant;
  const alphaExpr = [alpha.expr && c.toFloat(alpha.expr), cover.expr].filter(Boolean).join(" * ");

  // Emission from the BSDF itself plus any Emission shader added to it.
  const emitters = [[param(surface, "emission", [0, 0, 0]), param(surface, "strength", 1)]];
  if (surface.extraEmission) emitters.push([param(surface.extraEmission, "emission", [1, 1, 1]), param(surface.extraEmission, "strength", 1)]);
  const emissionIsProcedural = emitters.some(([col, s]) => col.expr || s.expr);
  const emissive = emitters.reduce((sum, [col, s]) => sum.add(new THREE.Color(...rgb(col)).multiplyScalar(scalar(s))), new THREE.Color(0, 0, 0));

  let bump = null;

// Rough in-scattered light for volumes, as a fraction of a mid-grey surface.
const VOLUME_LIGHT = 0.3;

// Beer–Lambert transmittance through half the mesh's mean extent, applied as
// a filter over whatever is behind it.
function finishVolume(info, geometry) {
  const material = info.material.clone();
  const size = geometry.boundingBox.getSize(new THREE.Vector3());
  const depth = (size.x + size.y + size.z) / 6;
  const { absorb, scatter } = info.volume;
  const transmittance = absorb.map((a, i) => Math.exp(-(a + scatter[i]) * depth));
  material.blendColor.setRGB(...transmittance.map((t, i) => t * info.tint[i]));
  if (material.isMeshBasicMaterial) {
    material.color.setRGB(...scatter.map((s, i) => {
      const extinction = absorb[i] + s;
      return extinction > 0 ? s / extinction * (1 - transmittance[i]) * VOLUME_LIGHT : 0;
    }));
  }
  return material;
}

function finishGeometry(g) {

function addGeneratedCoordinates(g) {
  g.computeBoundingBox();

  const p = g.attributes.position, generated = new Float32Array(p.count * 3);

    generated[i*3+1]=(p.getY(i)-min.y)/(size.y||1);
    generated[i*3+2]=(p.getZ(i)-min.z)/(size.z||1);
  }
  g.setAttribute("blendGenerated",new THREE.BufferAttribute(generated,3));

// Builds render geometry from Blender's face corners. Normals are split the
// way Blender splits them (flat faces, sharp edges); UVs and per-face
// material slots are carried through when present.
function geometryFromBlendMesh(m, blend, needsUV = false) {

    fanNormals = new Float32Array(cornerCount * 3);

  }

  // Fan-triangulate each face (as jsblender does), grouped by material slot.
  const slotOf = f => materialIndex ? Math.min(materialIndex[f], slots - 1) : 0;

    const n = offsets[f + 1] - offsets[f];

  }
  const starts = counts.map((_, s) => counts.slice(0, s).reduce((a, b) => a + b, 0));
  const index = new Uint32Array(counts.reduce((a, b) => a + b, 0)), cursor = starts.slice();
  for (let f = 0; f < faceCount; f++) {
    const start = offsets[f], n = offsets[f + 1] - start, s = slotOf(f);
    for (let k = 1; k < n - 1; k++) {
      index[cursor[s]++] = cornerOut[start];
      index[cursor[s]++] = cornerOut[start + k];
      index[cursor[s]++] = cornerOut[start + k + 1];
    }
  }
  g.setAttribute("position", new THREE.BufferAttribute(position.slice(0, count * 3), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(normal.slice(0, count * 3), 3));
  if (uv) g.setAttribute("blendUV", new THREE.BufferAttribute(uv.slice(0, count * 2), 2));
  g.setIndex(new THREE.BufferAttribute(index, 1));
  if (materialIndex) counts.forEach((n, s) => { if (n) g.addGroup(starts[s], n, s); });
  return finishGeometry(g);
}

        data.objects.forEach(o => visible.add(o));
      }
      list("LayerCollection", base, "layer_collections", "LayerCollection").forEach(walk);
    };
    layers.forEach(walk);
    for (const base of list("ViewLayer", viewLayer, "object_bases", "Base")) {
      if (number("Base", base, "flag") & 256) hiddenBases.add(pointer("Base", base, "object"));
    }
  } else {
    const root = sceneBlock ? pointer("Scene", sceneBlock.dataOffset, "master_collection") : undefined;
    if (root !== undefined) members(root).forEach(o => visible.add(o));
    else if (!sceneBlock) objectAt.forEach((_, base) => visible.add(base));
  }

  const expanded = [];
  const emit = (base, transform, path, ancestors) => {
    const info = objectAt.get(base);
    if (!info || info.hidden) return;
    const object = info.object;
    const world = new THREE.Matrix4().fromArray(object.worldMatrix);
    if (transform) world.premultiply(transform);
    expanded.push({ ...object, name: path + object.name, worldMatrix: world.toArray() });
    if (info.instance === undefined || ancestors.has(info.instance)) return;
    const collection = collectionAt(info.instance);
    const instanceWorld = world.clone().multiply(new THREE.Matrix4().makeTranslation(...collection.offset.map(v => -v)));

function applyBlenderWorldMatrix(obj3d, worldMatrix) {
  if (!worldMatrix || worldMatrix.length !== 16) return;
  // jsblender and Three.js store matrices in column-major order.
  obj3d.matrix.fromArray(worldMatrix);
  obj3d.matrixAutoUpdate = false;
}

function useSavedCamera(blend, objects) {
  const savedScene = extractScenes(blend)[0];
  const object = objects.find(o => o.name === savedScene?.cameraObject);
  const data = extractCameras(blend).find(c => c.name === object?.dataName);
  if (!object || !data || !["perspective", "orthographic"].includes(data.type)) return false;
  const aspect = view.clientWidth / Math.max(view.clientHeight, 1);
  const renderAspect = savedScene.resolutionX / Math.max(savedScene.resolutionY, 1);
  const near = Math.max(data.clipStart, 0.001);
  const far = Math.max(data.clipEnd, near + 1);
  if (data.type === "orthographic") {
    const vertical = data.sensorFit === "vertical" || (data.sensorFit === "auto" && renderAspect < 1);
    const height = vertical ? data.orthoScale : data.orthoScale / renderAspect;
    const width = height * renderAspect;
    const halfHeight = Math.max(height, width / aspect) / 2;
    camera = new THREE.OrthographicCamera(-halfHeight * aspect, halfHeight * aspect, halfHeight, -halfHeight, near, far);
    camera.userData.savedFrame = {width, height};
  } else {
    // Auto fit applies the sensor width to whichever render dimension is larger.
    const vertical = data.sensorFit === "vertical" || (data.sensorFit === "auto" && renderAspect < 1);
    const sensor = data.sensorFit === "vertical" ? data.sensorHeight : data.sensorWidth;
    const height = vertical ? sensor : sensor / renderAspect;
    const fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.max(height, height * renderAspect / aspect) / (2 * data.lens)));
    camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
  }
  camera.up.set(0, 0, 1);
  const matrix = new THREE.Matrix4().fromArray(object.worldMatrix);
  matrix.decompose(camera.position, camera.quaternion, new THREE.Vector3());
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const distance = Math.max(1, camera.position.length());
  controls.object = camera;
  controls.target.copy(camera.position).addScaledVector(forward, distance);
  controls.update();
  return true;
}

function modelBounds() {
  modelRoot.updateMatrixWorld(true);
  const bounds = [];
  modelRoot.traverse(obj => {
    if (!obj.isMesh) return;
    obj.geometry.computeBoundingBox();
    const local = obj.geometry.boundingBox;
    const size = local.getSize(new THREE.Vector3());
    const world = local.clone().applyMatrix4(obj.matrixWorld);
    bounds.push({ box: world, extent: world.getSize(new THREE.Vector3()).length(),
      flat: Math.min(size.x, size.y, size.z) < Math.max(size.x, size.y, size.z) * 1e-6 });
  });
  const solidExtent = Math.max(0, ...bounds.filter(b => !b.flat).map(b => b.extent));
  const box = new THREE.Box3();
  for (const b of bounds) {
    // Keep the studio floor in the scene without fitting the camera to it.
    if (solidExtent && b.flat && b.extent > solidExtent * 10) continue;
    box.union(b.box);
  }
  return box;
}

function fitCamera() {
  if (camera.isOrthographicCamera) {
    camera = new THREE.PerspectiveCamera(45, view.clientWidth / Math.max(view.clientHeight, 1), 0.01, 100000);
    camera.up.set(0, 0, 1);
    controls.object = camera;
  }
  const box = modelBounds();
  if (box.isEmpty()) return;

  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 0.001);
  const center = sphere.center;

  controls.target.copy(center);

  const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
  const halfFov = Math.min(verticalHalfFov, Math.atan(Math.tan(verticalHalfFov) * camera.aspect));
  const distance = (radius / Math.sin(halfFov)) * 1.15;
  const direction = new THREE.Vector3(1, -1.4, 0.9).normalize();

  camera.position.copy(center).addScaledVector(direction, distance);
  camera.near = Math.max(distance / 10000, radius / 10000, 0.001);
  camera.far = Math.max(distance * 100, radius * 100, 100);
  camera.updateProjectionMatrix();
  controls.update();

  // Scale grid to suit the scene.
  const size = Math.max(box.getSize(new THREE.Vector3()).length(), 1);
  grid.scale.setScalar(Math.pow(10, Math.floor(Math.log10(size / 10))));
}

async function loadBlend(rawURL) {
  if (loading) return;
  loading = true;
  loadButton.disabled = true;

  try {
    const share = new URL(location.href);
    share.searchParams.set("url", rawURL.trim());
    history.replaceState(null, "", share);

    const normalized = normalizeURL(rawURL);
    const displayNormalized = normalized !== rawURL.trim()
      ? `\nResolved GitHub URL → ${normalized}`
      : "";

    setStatus(`Fetching…${displayNormalized}`);

    const response = await fetch(normalized);
    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

    const contentLength = Number(response.headers.get("content-length"));
    if (contentLength) setStatus(`Downloading ${formatBytes(contentLength)}…${displayNormalized}`);

    const bytes = new Uint8Array(await response.arrayBuffer());
    setStatus(`Downloaded ${formatBytes(bytes.byteLength)}. Parsing .blend…`);

    // Give the browser one paint before synchronous parsing.
    await new Promise(requestAnimationFrame);

    const blend = parseBlend(bytes);
    const meshes = extractMeshes(blend);
    const objects = extractObjects(blend);
    const renderObjects = expandCollectionInstances(blend, objects);
    const materials = extractMaterials(blend);
    const curves = extractCurves(blend);
    readNodeSettings(blend, materials);

    const meshByName = new Map(meshes.map(m => [m.name, m]));
    const materialByName = new Map(materials.map(m => [m.name, m]));
    const materialInfos = new Map();
    const materialInfo = name => {
      if (!materialInfos.has(name)) materialInfos.set(name, buildMaterial(name ? materialByName.get(name) : null));
      return materialInfos.get(name);
    };

    clearModel();

    let renderedObjects = 0;
    let triangles = 0;
    let vertices = 0;
    const usedMeshNames = new Set();

    const meshResources = new Map();
    const meshResource = bm => {
      if (!meshResources.has(bm.name)) {
        const infos = (bm.materialSlotNames?.length ? bm.materialSlotNames : [null]).map(materialInfo);
        const geometry = geometryFromBlendMesh(bm, blend, infos.some(info => info.uses.has("uv")));
        const materials = infos.map(info => info.volume ? finishVolume(info, geometry) : info.material);
        meshResources.set(bm.name, {
          geometry,
          material: geometry.groups.length ? materials : materials[0],
          renderOrder: Math.max(...infos.map(info => info.renderOrder))
        });
      }
      return meshResources.get(bm.name);
    };
    const addMesh = (bm, name, worldMatrix) => {
      const { geometry, material, renderOrder } = meshResource(bm);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.renderOrder = renderOrder;
      applyBlenderWorldMatrix(mesh, worldMatrix);
      modelRoot.add(mesh);
      usedMeshNames.add(bm.name);
      renderedObjects++;
      vertices += bm.vertexCount || bm.vertices.length / 3;
      triangles += bm.triangles.length / 3;
    };

    // Collection instances share geometry/materials but have their own transforms.
    for (const obj of renderObjects) {
      if (!obj.dataName) continue;
      const bm = meshByName.get(obj.dataName);
      if (!bm || !bm.vertices?.length || !bm.triangles?.length) continue;
      addMesh(bm, obj.name || bm.name, obj.worldMatrix);
    }

    // Only use raw datablocks for files with no objects. Otherwise this would
    // resurrect excluded collection templates and hidden or unlinked geometry.
    for (const bm of objects.length ? [] : meshes) {
      if (usedMeshNames.has(bm.name) || !bm.vertices?.length || !bm.triangles?.length) continue;
      addMesh(bm, bm.name, null);
    }

    let renderedCurves = 0, renderedText = 0, skippedCurves = 0;
    const curveGroups = new Map();
    for (const obj of renderObjects) {
      if (![2, 4].includes(obj.type)) continue;
      const curve = curves.get(obj.dataName);
      if (!curve) { skippedCurves++; continue; }
      let template = curveGroups.get(obj.dataName);
      if (!template) {
        template = new THREE.Group();
        if (obj.type === 4 && curve.text) {
          try {
            template.add(new THREE.Mesh(await textGeometry(curve), materialInfo(curve.materialNames[0]).material));
          } catch (error) { console.warn("Text unavailable", obj.name, error); }
        } else if (!curve.customProfile) {
          for (const spline of curve.splines) {
            const geometry = curveGeometry(curve, spline);
            if (geometry) template.add(new THREE.Mesh(geometry, materialInfo(curve.materialNames[spline.material]).material));
          }
        }
        curveGroups.set(obj.dataName, template);
      }
      if (!template.children.length) { skippedCurves++; continue; }
      const group = template.clone();
      group.name = obj.name;
      if (obj.type === 4 && curve.text) renderedText++;
      else renderedCurves++;
      applyBlenderWorldMatrix(group, obj.worldMatrix);
      group.traverse(child => {
        if (!child.geometry) return;
        vertices += child.geometry.attributes.position.count;
        triangles += (child.geometry.index?.count || child.geometry.attributes.position.count) / 3;
      });
      modelRoot.add(group);
    }

    if (!renderedObjects && !renderedCurves && !renderedText) {
      throw new Error(`Parsed successfully, but found no renderable mesh geometry (${meshes.length} mesh datablocks, ${objects.length} objects).`);
    }

    const lightData = new Map(extractLights(blend).map(l => [l.name, l]));
    const energies = readLightEnergies(blend);
    for (const obj of renderObjects) {
      const data = obj.type === 10 && lightData.get(obj.dataName);
      if (data) addFileLight(data, energies.get(data.name) ?? data.energy, obj.worldMatrix);
    }
    const lightCount = fileLights.children.filter(l => l.isLight).length;
    fileLook = lightCount ? makeFileLook(readRenderSettings(blend)) : null;
    applyLighting();
    captureSurroundings();

    empty.style.display = "none";
    fitCamera();
    try { useSavedCamera(blend, objects); } catch (error) { console.warn("Saved camera unavailable", error); }

    const version = blend.header?.versionString
      ? `${blend.header.versionString.slice(0,2)}.${blend.header.versionString.slice(2)}`
      : (blend.header?.version ?? "?");

    setStatus(
      `Loaded Blender ${version} · ${formatBytes(bytes.byteLength)}\n` +
      `${renderedObjects} meshes · ${renderedCurves} curves · ${renderedText} text · ${vertices.toLocaleString()} vertices · ${Math.round(triangles).toLocaleString()} triangles · ${materials.length} materials · ${lightCount} lights` +
      (skippedCurves ? `\n${skippedCurves} unsupported curve/text objects` : "") +
      `\nPreview: approximate materials and text; unapplied modifiers are omitted.` +
      (normalized !== rawURL.trim() ? `\nGitHub URL resolved through jsDelivr` : "")
    );
  } catch (err) {
    console.error(err);
    setStatus(
      `Error: ${err?.message || err}\n\n` +
      `The URL must permit cross-origin fetches. jsblender 0.0.4 is primarily validated against Blender 5.x files.`
    );
  } finally {
    loading = false;
    loadButton.disabled = false;
  }
}

function resize() {
  const w = view.clientWidth;
  const h = view.clientHeight;
  renderer.setSize(w, h, false);
  hdrTarget.setSize(Math.max(1, Math.round(w * renderer.getPixelRatio())), Math.max(1, Math.round(h * renderer.getPixelRatio())));
  camera.aspect = w / Math.max(h, 1);
  if (camera.isOrthographicCamera) {
    const frame = camera.userData.savedFrame;
    const halfHeight = Math.max(frame.height, frame.width / camera.aspect) / 2;
    camera.left = -halfHeight * camera.aspect;
    camera.right = halfHeight * camera.aspect;
    camera.top = halfHeight;
    camera.bottom = -halfHeight;
  }
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

function animate() {
  controls.update();
  renderer.setRenderTarget(hdrTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(viewQuad, viewCamera);
  requestAnimationFrame(animate);
}
animate();

loadButton.addEventListener("click", () => {
  if (urlInput.value.trim()) loadBlend(urlInput.value);
});
urlInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && urlInput.value.trim()) loadBlend(urlInput.value);
});
$("#fit").addEventListener("click", fitCamera);
lightsButton.addEventListener("click", () => {
  useFileLighting = !useFileLighting;
  applyLighting();
});
$("#wire").addEventListener("click", () => {
  wireframe = !wireframe;
  modelRoot.traverse((obj) => {
    if (obj.isMesh) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => { if (m) m.wireframe = wireframe; });
    }
  });
});
$("#reset").addEventListener("click", () => {
  clearModel();
  urlInput.value = "";
  const share = new URL(location.href);
  share.searchParams.delete("url");
  history.replaceState(null, "", share);
});

const initial = new URL(location.href).searchParams.get("url");
if (initial) {
  urlInput.value = initial;
  loadBlend(initial);
}
</script>
