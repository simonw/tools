<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>.blend URL Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .55rem;
      padding: max(.65rem, env(safe-area-inset-top)) .7rem .65rem;
      background: rgba(20,20,20,.96);
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    #url {
      width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      color: #fff;
      background: #222;
      border: 1px solid #444;
      border-radius: .55rem;
      padding: .7rem .75rem;
      outline: none;
    }
    #url:focus { border-color: #888; }
    button {
      font: inherit;
      color: #fff;
      background: #333;
      border: 1px solid #555;
      border-radius: .55rem;
      padding: .65rem .85rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: #3d3d3d; }
    button:disabled { opacity: .5; cursor: default; }
    #view { position: relative; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute;
      left: max(.65rem, env(safe-area-inset-left));
      right: max(.65rem, env(safe-area-inset-right));
      bottom: max(.65rem, env(safe-area-inset-bottom));
      display: flex;
      gap: .45rem;
      align-items: end;
      pointer-events: none;
    }
    #status {
      max-width: min(42rem, calc(100vw - 1.3rem));
      background: rgba(15,15,15,.82);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: .65rem;
      padding: .55rem .7rem;
      backdrop-filter: blur(10px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .82rem;
      line-height: 1.35;
      pointer-events: auto;
    }
    #toolbar {
      position: absolute;
      top: .65rem;
      right: max(.65rem, env(safe-area-inset-right));
      display: flex;
      gap: .4rem;
      z-index: 4;
    }
    #toolbar button {
      background: rgba(30,30,30,.84);
      backdrop-filter: blur(8px);
      padding: .5rem .65rem;
      font-size: .86rem;
    }
    #empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      color: #aaa;
      pointer-events: none;
    }
    #empty strong { display: block; color: #ddd; margin-bottom: .35rem; }
    @media (max-width: 620px) {
      header { grid-template-columns: 1fr auto; }
      #status { font-size: .76rem; }
      #toolbar { top: .5rem; right: .5rem; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <input id="url" type="url" inputmode="url" autocapitalize="none" autocomplete="off"
      spellcheck="false" placeholder="https://example.com/model.blend or GitHub /blob/ URL">
    <button id="load">View</button>
  </header>

  <main id="view">
    <div id="empty">
      <div>
        <strong>Paste a CORS-accessible .blend URL above</strong>
        Blender 5.x files are the best-supported target.
      </div>
    </div>
    <div id="toolbar">
      <button id="fit" title="Fit model in view">Fit</button>
      <button id="wire" title="Toggle wireframe">Wireframe</button>
      <button id="reset" title="Reset viewer">Clear</button>
    </div>
    <div id="hud"><div id="status">Ready.</div></div>
  </main>

<script type="module">
import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { NURBSCurve } from "three/addons/curves/NURBSCurve.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import {
  parseBlend,
  extractMeshes,
  extractObjects,
  extractMaterials,
  extractCameras,
  extractScenes
} from "https://esm.sh/jsblender@0.0.4?bundle";

const $ = (s) => document.querySelector(s);
const urlInput = $("#url");
const loadButton = $("#load");
const status = $("#status");
const empty = $("#empty");
const view = $("#view");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181818);

let camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100000);
camera.up.set(0, 0, 1);
camera.position.set(4, -6, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
const studio = new RoomEnvironment();
scene.environment = pmrem.fromScene(studio).texture;
scene.environmentIntensity = 0.6;
studio.dispose();
pmrem.dispose();
view.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, -5, 8);
scene.add(key);

const grid = new THREE.GridHelper(20, 20, 0x666666, 0x333333);
grid.rotation.x = Math.PI / 2; // XY plane, because Blender uses Z-up
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

const modelRoot = new THREE.Group();
scene.add(modelRoot);

let wireframe = false;
let loading = false;

function setStatus(text) {
  status.textContent = text;
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
}

function normalizeURL(input) {
  const u = new URL(input.trim());

  // Normal GitHub file page:
  // https://github.com/owner/repo/blob/ref/path/file.blend
  if (u.hostname === "github.com") {
    const parts = u.pathname.split("/").filter(Boolean);
    const blobIndex = parts.indexOf("blob");
    if (blobIndex === 2 && parts.length >= 5) {
      const owner = parts[0];
      const repo = parts[1];
      const ref = parts[3];
      const path = parts.slice(4).join("/");
      // jsDelivr is usually convenient and CORS-friendly for public repositories.
      return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${path}`;
    }
  }
  return u.href;
}

function clearModel() {
  while (modelRoot.children.length) {
    const obj = modelRoot.children.pop();
    obj.traverse?.((child) => {
      child.geometry?.dispose?.();
      if (Array.isArray(child.material)) child.material.forEach(m => m.dispose?.());
      else child.material?.dispose?.();
    });
  }
  empty.style.display = "";
  setStatus("Ready.");
}

// Extra node storage not surfaced by jsblender's socket graph.
function readProceduralSettings(blend, materials) {
  const r = blend.reader;
  const offset = (type, base, name) => base + r.layoutOf(type).fieldByName.get(name).offset;
  const scalar = (type, base, name) => {
    const f = r.layoutOf(type).fieldByName.get(name);
    return Number(r.readPrimitive(f.typeName, base + f.offset));
  };
  for (const block of blend.blocks.filter(b => b.code === "MA")) {
    const name = r.readCString(offset("ID", block.dataOffset, "name"), 258).slice(2);
    const mat = materials.find(m => m.name === name);
    if (!mat?.shader) continue;
    const tree = r.followPointer(offset("Material", block.dataOffset, "nodetree"), block.dataOffset);
    if (!tree) continue;
    let node = r.followPointer(offset("bNodeTree", tree.dataOffset, "nodes"), tree.dataOffset);
    const seen = new Set();
    while (node && !seen.has(node.dataOffset)) {
      seen.add(node.dataOffset);
      const o = node.dataOffset;
      const nodeName = r.readCString(offset("bNode", o, "name"), 64);
      const parsed = mat.shader.nodes.find(n => n.name === nodeName);
      const storage = r.followPointer(offset("bNode", o, "storage"), tree.dataOffset);
      if (parsed?.idname === "ShaderNodeValToRGB" && storage) {
        const count = Math.min(32, scalar("ColorBand", storage.dataOffset, "tot"));
        parsed.ramp = Array.from({ length: count }, (_, i) => {
          const c = offset("ColorBand", storage.dataOffset, "data") + i * r.layoutOf("CBData").size;
          return { position: scalar("CBData", c, "pos"), color: ["r", "g", "b"].map(k => scalar("CBData", c, k)) };
        }).sort((a, b) => a.position - b.position);
      }
      if (parsed?.idname === "ShaderNodeTexVoronoi" && storage) parsed.feature = scalar("NodeTexVoronoi", storage.dataOffset, "feature");
      node = r.followPointer(offset("bNode", o, "next"), tree.dataOffset);
    }
  }
}

const proceduralGLSL = `
float blendHash(vec3 p) { return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
vec3 blendHash3(vec3 p) { return vec3(blendHash(p), blendHash(p+19.1), blendHash(p+47.7)); }
float blendNoise(vec3 p) {
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(blendHash(i),blendHash(i+vec3(1,0,0)),f.x),mix(blendHash(i+vec3(0,1,0)),blendHash(i+vec3(1,1,0)),f.x),f.y),
    mix(mix(blendHash(i+vec3(0,0,1)),blendHash(i+vec3(1,0,1)),f.x),mix(blendHash(i+vec3(0,1,1)),blendHash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float blendFBM(vec3 p, float detail, float roughness, float lacunarity) {
  float sum=0.0, weight=1.0, total=0.0;
  for(int i=0;i<9;i++) { if(float(i)>detail) break; sum+=weight*blendNoise(p); total+=weight; weight*=roughness; p*=lacunarity; }
  return sum/max(total,0.0001);
}
vec3 blendNoiseColor(vec3 p,float d,float r,float l) { return vec3(blendFBM(p,d,r,l),blendFBM(p+19.1,d,r,l),blendFBM(p+47.7,d,r,l)); }
float blendVoronoi(vec3 p, float edge, float randomness) {
  vec3 cell=floor(p), local=fract(p), nearest=vec3(0); float distance2=100.0;
  for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++) {
    vec3 g=vec3(float(x),float(y),float(z)); vec3 v=g+blendHash3(cell+g)*randomness-local;
    float d=dot(v,v); if(d<distance2) { distance2=d; nearest=v; }
  }
  if(edge<0.5) return sqrt(distance2);
  float result=100.0;
  for(int x=-2;x<=2;x++) for(int y=-2;y<=2;y++) for(int z=-2;z<=2;z++) {
    vec3 g=vec3(float(x),float(y),float(z)); vec3 v=g+blendHash3(cell+g)*randomness-local;
    vec3 delta=v-nearest; if(dot(delta,delta)>0.00001) result=min(result,dot(0.5*(nearest+v),normalize(delta)));
  }
  return result;
}`;

function applyProceduralMaterial(material, blenderMat) {
  const nodes = blenderMat.shader?.nodes || [];
  const principled = nodes.find(n => n.name === blenderMat.shader?.principled?.nodeName);
  if (!principled) return;
  const socket = (node, name) => node?.inputs.find(s => s.name === name || s.identifier === name);
  const num = x => Number.isFinite(Number(x)) ? Number(x).toFixed(8) : "0.0";
  const value = (node, name, fallback) => num(socket(node, name)?.defaultValue ?? fallback);
  const linked = s => nodes.find(n => n.name === s?.linkedFrom?.nodeName);
  // Compile only the supported connected subgraph. Other materials keep their
  // Principled fallback. Noise uses a WebGL approximation, not Cycles' kernel.
  function expression(node, output = "Color", depth = 0) {
    if (!node || depth > 12) return null;
    const input = socket(node, "Vector");
    const vector = input?.linkedFrom ? expression(linked(input), input.linkedFrom.socketName, depth + 1) : "vBlendGenerated";
    if (node.idname === "ShaderNodeTexNoise" && vector) {
      const p = `(${vector})*${value(node,"Scale",5)}`;
      const args = `${p},${value(node,"Detail",2)},${value(node,"Roughness",0.5)},${value(node,"Lacunarity",2)}`;
      return output === "Color" ? `blendNoiseColor(${args})` : `vec3(blendFBM(${args}))`;
    }
    if (node.idname === "ShaderNodeTexVoronoi" && vector && [0,3].includes(node.feature)) {
      return `vec3(blendVoronoi((${vector})*${value(node,"Scale",5)},${node.feature === 3 ? "1.0" : "0.0"},${value(node,"Randomness",1)}))`;
    }
    if (node.idname === "ShaderNodeValToRGB" && node.ramp?.length) {
      const fac = socket(node, "Fac");
      const f = expression(linked(fac), fac?.linkedFrom?.socketName, depth + 1);
      if (!f) return null;
      const rgb = c => `vec3(${c.map(num).join(",")})`;
      let result = rgb(node.ramp[0].color);
      for (let i=1;i<node.ramp.length;i++) {
        const a=node.ramp[i-1], b=node.ramp[i];
        result = `mix(${result},${rgb(b.color)},clamp(((${f}).x-${num(a.position)})/${num(Math.max(0.000001,b.position-a.position))},0.0,1.0))`;
      }
      return result;
    }
    return null;
  }
  const base = socket(principled, "Base Color"), normal = linked(socket(principled, "Normal"));
  const color = expression(linked(base), base?.linkedFrom?.socketName);
  const heightSocket = normal?.idname === "ShaderNodeBump" ? socket(normal, "Height") : null;
  const height = expression(linked(heightSocket), heightSocket?.linkedFrom?.socketName);
  if (!color && !height) return;
  material.onBeforeCompile = shader => {
    shader.vertexShader = "attribute vec3 blendGenerated; varying vec3 vBlendGenerated;\n" + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvBlendGenerated = blendGenerated;");
    shader.fragmentShader = "varying vec3 vBlendGenerated;\n" + proceduralGLSL + "\n" + shader.fragmentShader;
    if (color) shader.fragmentShader = shader.fragmentShader.replace("#include <color_fragment>", `#include <color_fragment>\ndiffuseColor.rgb = ${color};`);
    if (height) shader.fragmentShader = shader.fragmentShader.replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
      float bh=(${height}).x*${value(normal,"Distance",0.1)};
      vec3 bx=dFdx(-vViewPosition), by=dFdy(-vViewPosition);
      vec3 br1=cross(by,normal), br2=cross(normal,bx);
      float bd=dot(bx,br1);
      vec3 bn=normalize(abs(bd)*normal-sign(bd)*(dFdx(bh)*br1+dFdy(bh)*br2));
      normal=normalize(mix(normal,bn,${value(normal,"Strength",1)}));`);
  };
  material.customProgramCacheKey = () => JSON.stringify([color, height, normal?.inputs]);
}

function addGeneratedCoordinates(g) {
  g.computeBoundingBox();
  const min = g.boundingBox.min, size = g.boundingBox.getSize(new THREE.Vector3());
  const p = g.attributes.position, generated = new Float32Array(p.count * 3);
  for (let i=0;i<p.count;i++) {
    generated[i*3]=(p.getX(i)-min.x)/(size.x||1);
    generated[i*3+1]=(p.getY(i)-min.y)/(size.y||1);
    generated[i*3+2]=(p.getZ(i)-min.z)/(size.z||1);
  }
  g.setAttribute("blendGenerated",new THREE.BufferAttribute(generated,3));
}

function makeMaterial(blenderMat) {
  if (!blenderMat) {
    return new THREE.MeshStandardMaterial({
      color: 0xb9bcc4,
      metalness: 0,
      roughness: 0.72,
      side: THREE.DoubleSide,
      wireframe
    });
  }
  const p = blenderMat.shader?.principled;
  const rgba = p?.baseColor || blenderMat.diffuse || [0.7, 0.7, 0.7, 1];
  const alpha = p?.alpha ?? rgba[3] ?? 1;
  const node = blenderMat.shader?.nodes.find(n => n.name === p?.nodeName);
  const value = (name, fallback) => node?.inputs.find(s => s.name === name)?.defaultValue ?? fallback;
  const material = new THREE.MeshPhysicalMaterial({
    clearcoat: value("Coat Weight", 0),
    clearcoatRoughness: value("Coat Roughness", 0.03),
    transmission: value("Transmission Weight", 0),
    ior: p?.ior || 1.5,
    emissive: new THREE.Color(...(p?.emissionColor || [0, 0, 0]).slice(0, 3)),
    emissiveIntensity: p?.emissionStrength || 0,
    color: new THREE.Color(rgba[0], rgba[1], rgba[2]),
    metalness: THREE.MathUtils.clamp(p?.metallic ?? blenderMat.metallic ?? 0, 0, 1),
    roughness: THREE.MathUtils.clamp(p?.roughness ?? blenderMat.roughness ?? 0.7, 0.02, 1),
    opacity: alpha,
    transparent: alpha < 0.999,
    side: THREE.DoubleSide,
    wireframe
  });
  applyProceduralMaterial(material, blenderMat);
  return material;
}

function geometryFromBlendMesh(m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(m.vertices, 3));

  g.setIndex(new THREE.BufferAttribute(m.triangles, 1));

  if (m.vertexNormals?.length === m.vertices.length) {
    g.setAttribute("normal", new THREE.BufferAttribute(m.vertexNormals, 3));
  } else {
    g.computeVertexNormals();
  }

  g.computeBoundingBox();
  g.computeBoundingSphere();
  addGeneratedCoordinates(g);
  return g;
}

// Read legacy Curve datablocks using the file's own SDNA offsets (not a
// particular Blender version's memory layout).
function extractCurves(blend) {
  const r = blend.reader;
  if (!blend.sdna.structIndexByType.has("Curve")) return new Map();
  const field = (type, name) => r.layoutOf(type).fieldByName.get(name);
  const at = (type, offset, name) => offset + field(type, name).offset;
  const number = (type, offset, name) => {
    const f = field(type, name);
    return f ? Number(r.readPrimitive(f.typeName, offset + f.offset)) : 0;
  };
  const follow = (type, offset, name, anchor) => r.followPointer(at(type, offset, name), anchor);
  const idName = offset => r.readCString(at("ID", offset, "name"), field("ID", "name").size).slice(2);
  const curves = new Map();
  for (const block of blend.blocks) {
    if (blend.sdna.layouts[block.sdnaIndex]?.typeName !== "Curve") continue;
    const o = block.dataOffset;
    const slots = follow("Curve", o, "mat", o);
    const materialNames = [];
    for (let i = 0; slots && i < number("Curve", o, "totcol"); i++) {
      const m = r.followPointer(slots.dataOffset + i * blend.header.pointerSize, o);
      materialNames.push(m ? idName(m.dataOffset) : null);
    }
    const curve = { name: idName(o), materialNames, splines: [],
      depth: number("Curve", o, "ext2"), bevelResolution: number("Curve", o, "bevresol"),
      caps: Boolean(number("Curve", o, "flag") & 1024),
      size: number("Curve", o, "fsize"), align: number("Curve", o, "spacemode"),
      x: number("Curve", o, "xof"), y: number("Curve", o, "yof"),
      spacing: number("Curve", o, "spacing"), extrusion: number("Curve", o, "ext1"),
      customProfile: r.readPointer(at("Curve", o, "bevobj")) !== 0n
    };
    const str = follow("Curve", o, "str", o);
    if (str) curve.text = new TextDecoder().decode(r.buf.subarray(str.dataOffset, str.dataOffset + Math.min(str.size, number("Curve", o, "len")))).replace(/\0.*$/s, "");
    let nb = r.followPointer(at("Curve", o, "nurb") + field("ListBase", "first").offset, o);
    const visited = new Set();
    while (nb && !visited.has(nb.dataOffset)) {
      visited.add(nb.dataOffset);
      const n = nb.dataOffset;
      const type = number("Nurb", n, "type") & 7;
      const count = number("Nurb", n, "pntsu");
      const pointType = type === 1 ? "BezTriple" : "BPoint";
      const pb = follow("Nurb", n, type === 1 ? "bezt" : "bp", o);
      const points = [];
      const stride = r.layoutOf(pointType).size;
      if (pb && count >= 2 && count * stride <= pb.size && number("Nurb", n, "pntsv") <= 1) {
        for (let i = 0; i < count; i++) {
          const p = pb.dataOffset + stride * i;
          points.push({ vec: Array.from(r.readFloatArray(at(pointType, p, "vec"), type === 1 ? 9 : 4)), radius: number(pointType, p, "radius") });
        }
        const knots = follow("Nurb", n, "knotsu", o);
        curve.splines.push({ type, points, cyclic: Boolean(number("Nurb", n, "flagu") & 1),
          resolution: Math.max(1, number("Nurb", n, "resolu")), material: number("Nurb", n, "mat_nr"),
          order: number("Nurb", n, "orderu"), knots: knots ? Array.from(r.readFloatArray(knots.dataOffset, knots.size / 4)) : [] });
      }
      nb = follow("Nurb", n, "next", o);
    }
    curves.set(curve.name, curve);
  }
  return curves;
}

function curveGeometry(curve, spline) {
  const points = [], radii = [];
  const vector = (a, offset = 0) => new THREE.Vector3(...a.slice(offset, offset + 3));
  const controls = spline.points;
  const segmentCount = controls.length - (spline.cyclic ? 0 : 1);
  if (spline.type === 0 || spline.type === 1) {
    for (let i = 0; i < segmentCount; i++) {
      const a = controls[i], b = controls[(i + 1) % controls.length];
      const path = spline.type === 1 ? new THREE.CubicBezierCurve3(vector(a.vec, 3), vector(a.vec, 6), vector(b.vec), vector(b.vec, 3)) : new THREE.LineCurve3(vector(a.vec), vector(b.vec));
      const steps = spline.type === 1 ? Math.min(64, spline.resolution) : 1;
      for (let j = 0; j < steps; j++) {
        const t = j / steps;
        points.push(path.getPoint(t)); radii.push(THREE.MathUtils.lerp(a.radius, b.radius, t));
      }
    }
    const last = spline.cyclic ? controls[0] : controls.at(-1);
    points.push(vector(last.vec, spline.type === 1 ? 3 : 0)); radii.push(last.radius);
  } else if (spline.type === 4 && spline.knots.length) {
    const cp = controls.map(p => new THREE.Vector4(...p.vec));
    if (spline.cyclic) cp.push(...cp.slice(0, spline.order - 1));
    const path = new NURBSCurve(spline.order - 1, spline.knots, cp, spline.order - 1, cp.length);
    const steps = Math.min(4096, controls.length * spline.resolution);
    for (let i = 0; i <= steps; i++) {
      points.push(path.getPoint(i / steps));

function useSavedCamera(blend, objects) {

function fitCamera() {

async function loadBlend(rawURL) {

  loading = true;
  loadButton.disabled = true;

  try {
    const share = new URL(location.href);
    share.searchParams.set("url", rawURL.trim());
    history.replaceState(null, "", share);

    const normalized = normalizeURL(rawURL);
    const displayNormalized = normalized !== rawURL.trim()
      ? `\nResolved GitHub URL → ${normalized}`
      : "";

    setStatus(`Fetching…${displayNormalized}`);

    const response = await fetch(normalized);
    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

    const contentLength = Number(response.headers.get("content-length"));
    if (contentLength) setStatus(`Downloading ${formatBytes(contentLength)}…${displayNormalized}`);

    await new Promise(requestAnimationFrame);

    const meshes = extractMeshes(blend);
    const objects = extractObjects(blend);
    const materials = extractMaterials(blend);
    const curves = extractCurves(blend);
    readProceduralSettings(blend, materials);

    const meshByName = new Map(meshes.map(m => [m.name, m]));
    const materialByName = new Map(materials.map(m => [m.name, m]));

    clearModel();

    let renderedObjects = 0;
    let triangles = 0;
    let vertices = 0;
    const usedMeshNames = new Set();

    // Prefer object instances so Blender transforms are preserved.
    for (const obj of objects) {
      if (!obj.dataName) continue;
      const bm = meshByName.get(obj.dataName);
      if (!bm || !bm.vertices?.length || !bm.triangles?.length) continue;

      const geometry = geometryFromBlendMesh(bm);
      const slotName = bm.materialSlotNames?.[0];
      const material = makeMaterial(slotName ? materialByName.get(slotName) : null);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = obj.name || bm.name;
      applyBlenderWorldMatrix(mesh, obj.worldMatrix);
      modelRoot.add(mesh);

      usedMeshNames.add(bm.name);
      renderedObjects++;
      vertices += bm.vertexCount || bm.vertices.length / 3;
      triangles += bm.triangles.length / 3;
    }

    // Some files may have mesh datablocks that aren't represented by extractObjects().
    for (const bm of meshes) {
      if (usedMeshNames.has(bm.name) || !bm.vertices?.length || !bm.triangles?.length) continue;
      const geometry = geometryFromBlendMesh(bm);
      const slotName = bm.materialSlotNames?.[0];
      const material = makeMaterial(slotName ? materialByName.get(slotName) : null);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = bm.name;
      modelRoot.add(mesh);
      renderedObjects++;
      vertices += bm.vertexCount || bm.vertices.length / 3;
      triangles += bm.triangles.length / 3;
    }

    let renderedCurves = 0, renderedText = 0, skippedCurves = 0;
    for (const obj of objects) {
      if (![2, 4].includes(obj.type)) continue;
      const curve = curves.get(obj.dataName);
      if (!curve) { skippedCurves++; continue; }
      const group = new THREE.Group();
      group.name = obj.name;
      if (obj.type === 4 && curve.text) {
        try {
          group.add(new THREE.Mesh(await textGeometry(curve), makeMaterial(materialByName.get(curve.materialNames[0]))));
          renderedText++;
        } catch (error) { console.warn("Text unavailable", obj.name, error); }

        for (const spline of curve.splines) {
          const geometry = curveGeometry(curve, spline);
          if (geometry) group.add(new THREE.Mesh(geometry, makeMaterial(materialByName.get(curve.materialNames[spline.material]))));

      ? `${blend.header.versionString.slice(0,2)}.${blend.header.versionString.slice(2)}`

      `${renderedObjects} meshes · ${renderedCurves} curves · ${renderedText} text · ${vertices.toLocaleString()} vertices · ${Math.round(triangles).toLocaleString()} triangles · ${materials.length} materials` +
      (skippedCurves ? `\n${skippedCurves} unsupported curve/text objects` : "") +
      `\nPreview: approximate materials and text; unapplied modifiers are omitted.` +

    setStatus(
      `Error: ${err?.message || err}\n\n` +
      `The URL must permit cross-origin fetches. jsblender 0.0.4 is primarily validated against Blender 5.x files.`

  }

function resize() {
  const w = view.clientWidth;
  const h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);

    const frame = camera.userData.savedFrame;
    const halfHeight = Math.max(frame.height, frame.width / camera.aspect) / 2;
    camera.left = -halfHeight * camera.aspect;
    camera.right = halfHeight * camera.aspect;

new ResizeObserver(resize).observe(view);
resize();

function animate() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);

animate();

loadButton.addEventListener("click", () => {
  if (urlInput.value.trim()) loadBlend(urlInput.value);
});
urlInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && urlInput.value.trim()) loadBlend(urlInput.value);

$("#fit").addEventListener("click", fitCamera);
$("#wire").addEventListener("click", () => {
  wireframe = !wireframe;
  modelRoot.traverse((obj) => {
    if (obj.isMesh) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => { if (m) m.wireframe = wireframe; });

$("#reset").addEventListener("click", () => {
  clearModel();
  urlInput.value = "";
  const share = new URL(location.href);
  share.searchParams.delete("url");
  history.replaceState(null, "", share);
});

const initial = new URL(location.href).searchParams.get("url");
if (initial) {
  urlInput.value = initial;
  loadBlend(initial);
}
