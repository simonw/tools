<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to PNG, JPEG or WebP</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-size: 16px;
            line-height: 1.4;
            color: #1a1a1a;
            background: #fff;
        }
        h1 {
            margin: 0 0 4px;
            font-size: 1.7rem;
        }
        .intro {
            margin: 0 0 16px;
            color: #555;
        }
        textarea, input, button, select {
            font-size: 16px;
            font-family: inherit;
        }
        a {
            color: #0b5cad;
        }
        #dropZone {
            border: 2px dashed #b5b5b5;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
            transition: border-color 0.15s, background-color 0.15s;
        }
        #dropZone.dragover {
            border-color: #0b5cad;
            background-color: #eaf3fc;
        }
        #svgInput {
            display: block;
            width: 100%;
            height: 150px;
            border: none;
            background: transparent;
            resize: vertical;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 14px;
        }
        #svgInput:focus {
            outline: none;
        }
        #dropZone:focus-within {
            border-color: #0b5cad;
        }
        .source-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .button, button {
            display: inline-block;
            padding: 8px 14px;
            border: 1px solid #0b5cad;
            border-radius: 6px;
            background: #0b5cad;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }
        .button:hover, button:hover {
            background: #094a8c;
        }
        .button.secondary, button.secondary {
            background: #fff;
            color: #0b5cad;
        }
        .button.secondary:hover, button.secondary:hover {
            background: #eaf3fc;
        }
        #fileInput {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }
        #fileInput:focus-visible + label {
            outline: 2px solid #0b5cad;
            outline-offset: 2px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            align-items: flex-end;
            margin: 16px 0;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: none;
            margin: 0;
            padding: 0;
            min-width: 0;
        }
        .option-label, .option-group legend {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #555;
            padding: 0;
        }
        .option-group legend {
            margin-bottom: 6px;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 38px;
        }
        .segmented {
            display: inline-flex;
            border: 1px solid #0b5cad;
            border-radius: 6px;
            overflow: hidden;
        }
        .segmented label {
            cursor: pointer;
        }
        .segmented input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
        .segmented span {
            display: block;
            padding: 7px 14px;
            color: #0b5cad;
            background: #fff;
        }
        .segmented label + label span {
            border-left: 1px solid #0b5cad;
        }
        .segmented input:checked + span {
            background: #0b5cad;
            color: #fff;
        }
        .segmented input:focus-visible + span {
            outline: 2px solid #1a1a1a;
            outline-offset: -3px;
        }
        input[type="number"] {
            width: 90px;
            padding: 7px 8px;
            border: 1px solid #b5b5b5;
            border-radius: 6px;
        }
        input[type="color"] {
            width: 44px;
            height: 38px;
            padding: 2px;
            border: 1px solid #b5b5b5;
            border-radius: 6px;
            background: #fff;
        }
        input[type="range"] {
            width: 130px;
        }
        #qualityValue {
            min-width: 2.5em;
            font-variant-numeric: tabular-nums;
        }
        #message {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #e0b4b4;
            background: #fdf0f0;
            color: #8a1f1f;
        }
        #message.warning {
            border-color: #e6d08a;
            background: #fff9e0;
            color: #6b5200;
        }
        #result {
            margin-top: 20px;
        }
        .result-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            margin-bottom: 12px;
        }
        #fileSize {
            color: #555;
            font-variant-numeric: tabular-nums;
        }
        #imageContainer {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            overflow: auto;
            /* Checkerboard so transparent areas are visible */
            background-color: #fff;
            background-image:
                linear-gradient(45deg, #e4e4e4 25%, transparent 25%, transparent 75%, #e4e4e4 75%),
                linear-gradient(45deg, #e4e4e4 25%, transparent 25%, transparent 75%, #e4e4e4 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        #convertedImage {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
            cursor: zoom-in;
        }
        #convertedImage.full-size {
            max-width: unset;
            cursor: zoom-out;
        }
        .hint {
            margin: 6px 0 0;
            font-size: 0.85rem;
            color: #555;
        }
        #output {
            margin-top: 20px;
        }
        #output summary {
            cursor: pointer;
            font-weight: bold;
        }
        #base64Output {
            max-height: 200px;
            overflow: auto;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            font-size: 12px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>SVG to PNG, JPEG or WebP</h1>
    <p class="intro">Paste, drop or open an SVG to render it as a bitmap image. Everything happens in your browser.</p>

    <div id="dropZone">
        <textarea id="svgInput" aria-label="SVG code" spellcheck="false" placeholder="Paste your SVG code here or drag &amp; drop an SVG file"></textarea>
    </div>
    <div class="source-row">
        <input type="file" id="fileInput" accept=".svg,image/svg+xml">
        <label for="fileInput" class="button secondary">Open SVG file…</label>
        <a href="?url=https://gist.githubusercontent.com/simonw/aedecb93564af13ac1596810d40cac3c/raw/83e7f3be5b65bba61124684700fa7925d37c36c3/tiger.svg" id="loadExampleLink">Load example image</a>
    </div>

    <div class="options">
        <fieldset class="option-group">
            <legend>Format</legend>
            <div class="segmented">
                <label><input type="radio" name="format" value="image/jpeg" checked><span>JPEG</span></label>
                <label><input id="pngRadio" type="radio" name="format" value="image/png"><span>PNG</span></label>
                <label><input id="webpRadio" type="radio" name="format" value="image/webp"><span>WebP</span></label>
            </div>
        </fieldset>
        <div class="option-group" id="qualityGroup">
            <label class="option-label" for="qualityInput">Quality</label>
            <div class="option-row">
                <input type="range" id="qualityInput" min="1" max="100" value="90">
                <span id="qualityValue">90</span>
            </div>
        </div>
        <div class="option-group">
            <label class="option-label" for="widthInput">Width (px)</label>
            <input type="number" id="widthInput" value="800" min="1">
        </div>
        <div class="option-group">
            <label class="option-label" for="paddingInput">Padding (px)</label>
            <input type="number" id="paddingInput" value="0" min="0">
        </div>
        <div class="option-group">
            <label class="option-label" for="bgColor">Background</label>
            <div class="option-row">
                <input type="color" id="bgColor" value="#ffffff">
                <label><input type="checkbox" id="transparentBg"> Transparent</label>
            </div>
        </div>
    </div>

    <div id="message" role="alert" hidden></div>

    <div id="result" hidden>
        <div class="result-bar">
            <a id="downloadLink" class="button">Download image</a>
            <span id="fileSize"></span>
        </div>
        <div id="imageContainer"></div>
        <p class="hint">Click the image to toggle between fitted and full size.</p>
        <details id="output">
            <summary>Base64 image tag</summary>
            <pre id="base64Output"></pre>
            <button id="copyImageButton" class="secondary" type="button">Copy image tag</button>
        </details>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const svgInput = document.getElementById('svgInput');
        const fileInput = document.getElementById('fileInput');
        const widthInput = document.getElementById('widthInput');
        const paddingInput = document.getElementById('paddingInput');
        const qualityInput = document.getElementById('qualityInput');
        const qualityValue = document.getElementById('qualityValue');
        const qualityGroup = document.getElementById('qualityGroup');
        const bgColor = document.getElementById('bgColor');
        const transparentBg = document.getElementById('transparentBg');
        const pngRadio = document.getElementById('pngRadio');
        const messageDiv = document.getElementById('message');
        const resultDiv = document.getElementById('result');
        const imageContainer = document.getElementById('imageContainer');
        const base64Output = document.getElementById('base64Output');
        const downloadLink = document.getElementById('downloadLink');
        const fileSizeSpan = document.getElementById('fileSize');
        const copyImageButton = document.getElementById('copyImageButton');
        const formatRadios = document.querySelectorAll('input[name="format"]');

        const FORMATS = {
            'image/jpeg': {label: 'JPEG', extension: 'jpg', lossy: true, alpha: false},
            'image/png': {label: 'PNG', extension: 'png', lossy: false, alpha: true},
            'image/webp': {label: 'WebP', extension: 'webp', lossy: true, alpha: true}
        };

        // Base name used for the download, updated when a file or URL is loaded
        let baseName = 'converted_image';
        // Incremented for every render so stale async renders can be discarded
        let renderId = 0;

        function getFormat() {
            return document.querySelector('input[name="format"]:checked').value;
        }

        function showMessage(text, isWarning) {
            messageDiv.textContent = text;
            messageDiv.classList.toggle('warning', !!isWarning);
            messageDiv.hidden = false;
        }
        function clearMessage() {
            messageDiv.hidden = true;
            messageDiv.textContent = '';
        }
        function clearResult() {
            resultDiv.hidden = true;
            imageContainer.innerHTML = '';
            base64Output.textContent = '';
            fileSizeSpan.textContent = '';
            downloadLink.removeAttribute('href');
        }
        function showError(text) {
            clearResult();
            showMessage(text);
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} bytes`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function setBaseNameFrom(name) {
            const cleaned = (name || '').split(/[\\/]/).pop().replace(/\.svgz?$/i, '').trim();
            baseName = cleaned || 'converted_image';
        }

        // ===== Hash <-> Text Sync Helpers =====
        function getTextFromHash() {
            if (!location.hash || location.hash.length <= 1) return null;
            try {
                return decodeURIComponent(location.hash.slice(1));
            } catch (e) {
                console.warn('Could not decode hash:', e);
                return null;
            }
        }
        function setHashFromText(text) {
            // Avoid spamming history with each render
            const encoded = encodeURIComponent(text);
            const target = '#' + encoded;
            if (location.hash !== target) {
                if (history.replaceState) {
                    history.replaceState(null, '', target);
                } else {
                    location.hash = encoded;
                }
            }
        }
        function loadFromHashIfPresent() {
            const text = getTextFromHash();
            if (text) {
                svgInput.value = text;
                convertSvgToImage();
            }
        }
        window.addEventListener('hashchange', () => {
            const text = getTextFromHash();
            if (text !== null) {
                svgInput.value = text;
                convertSvgToImage();
            }
        });

        // Debounce function to prevent too many updates
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }

        function updateFormatControls() {
            const info = FORMATS[getFormat()];
            qualityGroup.hidden = !info.lossy;
            qualityValue.textContent = qualityInput.value;
        }

        // Instant preview updates
        const debouncedConvert = debounce(convertSvgToImage, 300);
        svgInput.addEventListener('input', debouncedConvert);
        paddingInput.addEventListener('input', debouncedConvert);
        widthInput.addEventListener('input', debouncedConvert);
        qualityInput.addEventListener('input', () => {
            qualityValue.textContent = qualityInput.value;
            debouncedConvert();
        });
        formatRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                // JPEG has no alpha channel
                if (!FORMATS[getFormat()].alpha) {
                    transparentBg.checked = false;
                }
                updateFormatControls();
                convertSvgToImage();
            });
        });

        // Color and transparency handling
        bgColor.addEventListener('input', () => {
            transparentBg.checked = false;
            debouncedConvert();
        });
        transparentBg.addEventListener('change', () => {
            if (transparentBg.checked && !FORMATS[getFormat()].alpha) {
                pngRadio.checked = true;
                updateFormatControls();
            }
            convertSvgToImage();
        });

        // Load SVG from ?url= parameter if present
        function loadFromUrlParamIfPresent() {
            const urlParams = new URLSearchParams(window.location.search);
            const svgUrl = urlParams.get('url');
            if (svgUrl) {
                fetch(svgUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(data => {
                        try {
                            setBaseNameFrom(new URL(svgUrl, location.href).pathname);
                        } catch (e) {
                            // Keep the default name
                        }
                        svgInput.value = data;
                        convertSvgToImage();
                    })
                    .catch(error => {
                        console.error('Error loading SVG from URL:', error);
                        showError('Failed to load SVG from URL: ' + error.message);
                    });
                return true;
            }
            return false;
        }

        // Drag and drop functionality
        function isSvgFile(file) {
            return file && (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name));
        }
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (!file) {
                // Dragged text: let the textarea handle it
                dropZone.classList.remove('dragover');
                return;
            }
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(file);
        });

        // File input functionality
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
            fileInput.value = '';
        });

        function handleFile(file) {
            if (!file) return;
            if (!isSvgFile(file)) {
                showMessage(`${file.name} does not look like an SVG file`);
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                setBaseNameFrom(file.name);
                svgInput.value = e.target.result;
                convertSvgToImage(); // Update preview with the loaded file
            };
            reader.readAsText(file);
        }

        // ===== Encoding =====
        // Browsers that cannot encode a format from a canvas silently hand back
        // a PNG instead: Safari cannot do WebP. Feature-detect once, and only
        // when the browser cannot do it natively (or ignores quality) load the
        // jSquash wasm encoder (Squoosh's libwebp build) from jsdelivr, the
        // first time WebP is actually requested.
        const JSQUASH_WEBP_ENCODE_URL = 'https://cdn.jsdelivr.net/npm/@jsquash/webp@1.5.0/encode.js/+esm';

        const nativeEncodeSupportPromises = {};
        function canvasCanEncode(mimeType) {
            if (!nativeEncodeSupportPromises[mimeType]) {
                nativeEncodeSupportPromises[mimeType] = (async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    if (!canvas.toBlob) return false;
                    // Noise, so that a lower quality has detail to throw away
                    const ctx = canvas.getContext('2d');
                    const noise = ctx.createImageData(64, 64);
                    for (let i = 0; i < noise.data.length; i++) {
                        noise.data[i] = i % 4 === 3 ? 255 : Math.random() * 256;
                    }
                    ctx.putImageData(noise, 0, 0);
                    const encodeAt = (quality) => new Promise((resolve) => {
                        try {
                            canvas.toBlob(resolve, mimeType, quality);
                        } catch (err) {
                            resolve(null);
                        }
                    });
                    const [low, high] = await Promise.all([encodeAt(0.2), encodeAt(0.9)]);
                    return Boolean(
                        low && high &&
                        low.type === mimeType && high.type === mimeType &&
                        low.size !== high.size
                    );
                })();
            }
            return nativeEncodeSupportPromises[mimeType];
        }

        let jsquashWebpPromise = null;
        function loadJsquashWebpEncoder() {
            if (!jsquashWebpPromise) {
                // Call init() explicitly: encode() would otherwise cache a failed
                // wasm load for the lifetime of the page, so a flaky connection
                // could never be retried.
                jsquashWebpPromise = import(JSQUASH_WEBP_ENCODE_URL).then(async (mod) => {
                    await mod.init();
                    return mod.default;
                });
                jsquashWebpPromise.catch(() => { jsquashWebpPromise = null; });
            }
            return jsquashWebpPromise;
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }

        // Returns a data: URL of the canvas in the requested format
        async function encodeCanvas(canvas, mimeType, quality) {
            if (mimeType === 'image/webp' && !(await canvasCanEncode(mimeType))) {
                const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
                const encode = await loadJsquashWebpEncoder();
                const buffer = await encode(imageData, {quality: Math.round(quality * 100)});
                return blobToDataUrl(new Blob([buffer], {type: 'image/webp'}));
            }
            const dataUrl = canvas.toDataURL(mimeType, quality);
            if (!dataUrl.startsWith(`data:${mimeType}`)) {
                throw new Error('the browser could not encode it - try a smaller width');
            }
            return dataUrl;
        }

        function convertSvgToImage() {
            const thisRender = ++renderId;
            let svgContent = svgInput.value;

            // If there's no SVG content, don't try to convert (and clear preview)
            if (!svgContent.trim()) {
                clearMessage();
                clearResult();
                return;
            }

            const requestedFormat = getFormat();
            const quality = (parseInt(qualityInput.value) || 90) / 100;
            const newWidth = Math.max(1, parseInt(widthInput.value) || 800);
            const padding = Math.max(0, parseInt(paddingInput.value) || 0);

            // Extract the SVG element, ignoring any surrounding content
            const lowerContent = svgContent.toLowerCase();
            const svgStart = lowerContent.indexOf('<svg');
            const svgEnd = lowerContent.lastIndexOf('</svg>');

            if (svgStart === -1 || svgEnd === -1) {
                showError('Invalid SVG input: could not find an <svg>…</svg> element');
                return;
            }

            svgContent = svgContent.slice(svgStart, svgEnd + '</svg>'.length);

            // Parse it to read the dimensions
            const svgElement = new DOMParser().parseFromString(svgContent, 'image/svg+xml').documentElement;

            if (!svgElement || svgElement.nodeName !== 'svg') {
                showError('Invalid SVG input: the SVG could not be parsed as XML');
                return;
            }

            // Get SVG viewBox
            let width, height;
            const viewBox = (svgElement.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
            if (viewBox.length === 4 && viewBox[2] > 0 && viewBox[3] > 0) {
                [, , width, height] = viewBox;
            } else {
                width = parseFloat(svgElement.getAttribute('width')) || 300;
                height = parseFloat(svgElement.getAttribute('height')) || 150;
            }

            // Calculate new dimensions with padding
            const aspectRatio = width / height;
            const contentWidth = newWidth;
            const contentHeight = Math.max(1, Math.round(contentWidth / aspectRatio));

            // Total canvas dimensions including padding
            const totalWidth = contentWidth + (padding * 2);
            const totalHeight = contentHeight + (padding * 2);

            // Create off-screen canvas
            const canvas = document.createElement('canvas');
            canvas.width = totalWidth;
            canvas.height = totalHeight;
            const ctx = canvas.getContext('2d');

            // Set background color if not transparent
            if (!transparentBg.checked) {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, totalWidth, totalHeight);
            }

            const svgBlob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
            const svgUrl = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.onerror = function() {
                URL.revokeObjectURL(svgUrl);
                if (thisRender !== renderId) return;
                showError('The browser could not render this SVG');
            };
            img.onload = async function() {
                URL.revokeObjectURL(svgUrl);
                if (thisRender !== renderId) return;

                // Draw the image with padding
                ctx.drawImage(img, padding, padding, contentWidth, contentHeight);

                // Convert to selected format, loading a wasm encoder if needed
                let imageDataUrl;
                try {
                    imageDataUrl = await encodeCanvas(canvas, requestedFormat, quality);
                } catch (err) {
                    console.error(err);
                    if (thisRender !== renderId) return;
                    showError(`Could not create a ${totalWidth}×${totalHeight} ${FORMATS[requestedFormat].label}: ${err.message || err}`);
                    return;
                }
                if (thisRender !== renderId) return;
                clearMessage();
                const info = FORMATS[requestedFormat];

                // Calculate file size from the base64 data
                const base64 = imageDataUrl.slice(imageDataUrl.indexOf(',') + 1);
                const paddingChars = base64.endsWith('==') ? 2 : (base64.endsWith('=') ? 1 : 0);
                const fileSizeInBytes = (base64.length * 3) / 4 - paddingChars;

                // Display converted image
                imageContainer.innerHTML = '';  // Clear previous image
                const convertedImg = document.createElement('img');
                convertedImg.src = imageDataUrl;
                convertedImg.id = 'convertedImage';
                convertedImg.alt = `Converted ${info.label}`;
                convertedImg.width = totalWidth;
                convertedImg.height = totalHeight;
                convertedImg.onclick = toggleImageSize;
                imageContainer.appendChild(convertedImg);

                // Set up download link and display file size
                downloadLink.href = imageDataUrl;
                downloadLink.download = `${baseName}.${info.extension}`;
                downloadLink.textContent = `Download ${info.label}`;
                fileSizeSpan.textContent = `${totalWidth} × ${totalHeight} px, ${formatBytes(fileSizeInBytes)}`;

                // Display base64 image tag
                const imgTag = `<img src="${imageDataUrl}" alt="Converted ${info.label}" width="${totalWidth}" height="${totalHeight}">`;
                base64Output.textContent = imgTag;
                resultDiv.hidden = false;

                // Update URL hash with current textarea contents AFTER a successful render
                // (but not when loading from ?url= parameter - the URL already references the source)
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.get('url')) {
                    setHashFromText(svgInput.value);
                }
            };
            img.src = svgUrl;
        }

        function toggleImageSize() {
            const img = document.getElementById('convertedImage');
            if (img) img.classList.toggle('full-size');
        }

        function copyBase64Tag() {
            const done = () => {
                const origText = 'Copy image tag';
                copyImageButton.innerText = 'Copied to clipboard';
                setTimeout(() => {
                    copyImageButton.innerText = origText;
                }, 2000);
            };
            const fallback = () => {
                const range = document.createRange();
                range.selectNode(base64Output);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                done();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(base64Output.textContent).then(done, fallback);
            } else {
                fallback();
            }
        }
        copyImageButton.addEventListener('click', copyBase64Tag);

        updateFormatControls();

        // On first load, check for ?url= parameter first, then fall back to hash
        window.addEventListener('DOMContentLoaded', () => {
            if (!loadFromUrlParamIfPresent()) {
                loadFromHashIfPresent();
            }
        });
    </script>
</body>
</html>
